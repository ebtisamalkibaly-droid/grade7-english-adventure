*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;color:var(--ink);background:radial-gradient(circle at 95% 0%,#e0f5ee 0%,transparent 28%),radial-gradient(circle at 3% 25%,#fff4e5,transparent 24%),var(--bg);font:16px/1.55 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,select{font:inherit}button{cursor:pointer}button:disabled{cursor:not-allowed;opacity:.48}a{color:var(--teal)}.wrap{max-width:1190px;margin:0 auto;padding:0 22px}.topbar{position:sticky;z-index:10;top:0;background:rgba(255,255,255,.95);border-bottom:1px solid var(--line);backdrop-filter:blur(15px)}.top-inner{height:72px;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:12px;font-size:1.14rem;font-weight:900;letter-spacing:-.5px}.brand-icon{width:42px;height:42px;border-radius:14px;display:grid;place-items:center;background:#daf4e9;font-size:24px}.brand small{display:block;font-size:.7rem;color:var(--muted);font-weight:700;letter-spacing:1.4px}.nav{display:flex;gap:6px;flex-wrap:wrap}.nav button{background:none;border:0;border-radius:12px;padding:9px 13px;color:#49685e;font-weight:750}.nav button.active,.nav button:hover{background:#d9f4e9;color:var(--dark)}.hero{margin:28px 0 22px;background:linear-gradient(122deg,#063e36,#087b67 72%,#08a88b);border-radius:28px;color:white;overflow:hidden;display:flex;min-height:240px;position:relative;box-shadow:var(--shade)}.hero:after{content:'✦ ✧ ✦';position:absolute;right:6%;top:0;transform:rotate(12deg);font-size:125px;letter-spacing:20px;opacity:.13}.hero-copy{padding:36px 38px;position:relative;z-index:2;max-width:820px}.eyebrow{font-size:.73rem;letter-spacing:2.2px;text-transform:uppercase;font-weight:900;opacity:.8}.hero h1{font-size:clamp(2rem,4vw,3.05rem);line-height:1.08;margin:9px 0 15px;letter-spacing:-1.5px}.hero p{opacity:.91;max-width:660px;margin:0}.hero-stats{display:flex;flex-wrap:wrap;gap:10px;margin-top:22px}.stat{background:rgba(255,255,255,.12);padding:7px 13px;border:1px solid rgba(255,255,255,.21);border-radius:24px;font-size:.83rem;font-weight:800}.sectionbar{display:flex;align-items:end;justify-content:space-between;gap:14px;margin:25px 0 15px;flex-wrap:wrap}.sectionbar h2{margin:0;font-size:1.6rem;letter-spacing:-.7px}.sectionbar p{margin:2px 0 0;color:var(--muted)}.card{background:white;border:1px solid var(--line);border-radius:21px;box-shadow:0 8px 28px rgba(32,84,67,.045)}.pad{padding:24px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.grid4{grid-template-columns:repeat(4,minmax(0,1fr))}.cta{border:0;border-radius:13px;padding:12px 20px;font-weight:850;display:inline-flex;align-items:center;justify-content:center;gap:9px;transition:.18s;box-shadow:none}.cta.primary{background:var(--teal);color:white}.cta.primary:hover{background:#056c59;transform:translateY(-1px)}.cta.soft{background:#e5f5ee;color:var(--dark)}.cta.outline{background:white;border:1px solid #cbdcd6;color:var(--dark)}.cta.danger{background:#fff0ec;color:#a84130}.cta.tiny{padding:7px 11px;font-size:.82rem}.cta:focus-visible,.option:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #eeb64c;outline-offset:2px}.control{padding:10px 13px;border:1px solid #cadcd6;border-radius:12px;background:#fff;color:var(--dark)}.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center}.filters input{min-width:240px}.pill{display:inline-block;border-radius:50px;padding:5px 11px;font-size:.75rem;font-weight:850;background:#eef6f3;color:#477266}.pill.easy{background:#e0f6e9;color:#137a4c}.pill.moderate{background:#fff2d6;color:#a36b0d}.pill.challenging{background:#ffe7e1;color:#b94a35}.word-card{padding:19px;min-height:250px;position:relative;overflow:hidden}.word-art{height:109px;border-radius:16px;background:linear-gradient(145deg,#d1f1e7,#ebfbf5);display:flex;align-items:center;justify-content:center;font-size:66px;text-shadow:0 4px 3px rgba(0,0,0,.08);margin-bottom:13px}.word-art.unit2{background:linear-gradient(135deg,#e3efff,#d4f5f1)}.word-art.unit3{background:linear-gradient(135deg,#fff0d5,#fbe4e6)}.word-art.unit4{background:linear-gradient(135deg,#f0eaff,#e6f4fe)}.word-card h3{font-size:1.12rem;margin:0 0 2px}.arabic{font-family:Tahoma,"Noto Naskh Arabic",Arial,sans-serif;direction:rtl;color:#0e7a66;font-weight:850;font-size:1.02rem}.word-card .mean{color:#53736a;font-size:.9rem;margin:7px 0}.example{font-size:.83rem;background:#f5f9f7;border-left:3px solid #83ccaf;padding:9px;border-radius:5px;color:#38584e}.word-foot{margin-top:12px;display:flex;justify-content:space-between;gap:8px;align-items:center}.unit-tag{font-size:.71rem;text-transform:uppercase;letter-spacing:1px;color:#637e76;font-weight:800}.muted{color:var(--muted)}.footer{padding:32px 0 48px;color:#648078;font-size:.82rem;text-align:center}.setup-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.mode-card{padding:25px;display:flex;flex-direction:column;align-items:start;gap:13px}.mode-art{font-size:43px;background:#edf7f2;display:grid;place-items:center;width:70px;height:70px;border-radius:20px}.mode-card h3{font-size:1.2rem;margin:0}.mode-card p{color:var(--muted);margin:0;flex:1;font-size:.92rem}.field{display:flex;flex-direction:column;gap:5px;font-size:.8rem;font-weight:800;color:#40675c}.field input,.field select{padding:11px;border-radius:10px;border:1px solid #bcd8cd;background:#fff;min-width:0}.form-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.quiz-shell{display:grid;grid-template-columns:minmax(0,1fr) 255px;gap:19px;align-items:start}.timer{font-weight:950;font-size:1.6rem;letter-spacing:.3px;color:var(--dark);font-variant-numeric:tabular-nums}.timer.low{color:#c64f3c}.progress-track{height:10px;border-radius:50px;background:#e5f1ed;overflow:hidden;margin:12px 0}.progress-fill{background:linear-gradient(90deg,#0ab188,#31b795);height:100%;transition:width .24s}.question{font-size:clamp(1.2rem,2vw,1.56rem);line-height:1.5;font-weight:850;margin:16px 0}.options{display:grid;gap:10px}.option{width:100%;text-align:left;display:flex;align-items:center;gap:15px;border:2px solid #e0ebe7;border-radius:15px;background:#fff;color:var(--dark);font-weight:740;padding:14px 17px}.option:hover:not(:disabled){background:#f0fbf6;border-color:#8ecbb4}.option .letter{flex:0 0 35px;width:35px;height:35px;border-radius:11px;background:#edf6f2;display:grid;place-items:center;font-weight:900}.option.selected{border-color:#0ba07e;background:#edfaf5}.option.wrong{border-color:#e87f67;background:#fff1ed}.feedback{border-radius:16px;padding:18px 20px;margin-top:20px;border:1px solid #b4decc;background:#f1fbf5}.feedback.bad{background:#fff6ec;border-color:#f3d2a5}.feedback h3{margin:0 0 7px}.feedback p{margin:5px 0}.feedback .evidence{padding:10px 13px;border-left:4px solid #18a784;background:#fff;border-radius:8px;margin:10px 0;color:#255b4b}.side{position:sticky;top:93px;padding:20px}.side p{font-size:.85rem;color:var(--muted)}.mark{background:#ffdf8f;border-radius:4px;padding:0 3px;box-decoration-break:clone}.passage{font-size:1.02rem;line-height:1.93;letter-spacing:.05px;color:#29463d}.passage p{margin:0 0 16px}.reading-shell{display:grid;grid-template-columns:minmax(0,1.24fr) minmax(0,.95fr);gap:17px;align-items:start}.reading-panel{max-height:70vh;overflow:auto;position:sticky;top:92px}.read-q{position:sticky;top:90px}.back{border:0;background:none;color:#16765f;font-weight:850;padding:6px 0}.results{text-align:center;padding:38px}.results .big{font-size:3.8rem;font-weight:1000;color:#087e66;line-height:1.2}.results h2{margin:8px 0;font-size:1.9rem}.badgelist{display:flex;gap:8px;flex-wrap:wrap}.helptext{font-size:.85rem;color:#6a857a}.numbered{font-feature-settings:'tnum'}.notice{padding:16px 20px;background:#fff8e8;border-left:4px solid #efbb62;border-radius:9px;color:#74532e}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.hide{display:none!important}@media(max-width:950px){.grid4{grid-template-columns:repeat(3,minmax(0,1fr))}.reading-shell,.quiz-shell{grid-template-columns:1fr}.reading-panel,.read-q,.side{position:static;max-height:none}.setup-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:650px){.wrap{padding:0 12px}.top-inner{height:auto;min-height:67px;padding:10px 0;flex-wrap:wrap}.nav{width:100%;justify-content:flex-start;gap:0}.nav button{font-size:.79rem;padding:7px 10px}.hero{border-radius:20px;min-height:200px}.hero-copy{padding:26px 22px}.grid,.grid4,.setup-grid,.form-row{grid-template-columns:1fr}.word-card{min-height:0}.word-art{height:92px}.reading-shell,.quiz-shell{gap:11px}.pad{padding:17px}.question{font-size:1.18rem}.side{order:-1}.filters input{min-width:0;width:100%}}
</style></head><body><header class="topbar"><div class="wrap top-inner"><div class="brand"><span class="brand-icon">🔎</span><span>READING DETECTIVE LAB<small>GRADE 7 • ENGLISH • CYCLE 2</small></span></div><nav class="nav" id="nav"></nav></div></header><main class="wrap" id="app"></main><footer class="wrap footer">Independent classroom revision resource based on Grade 7 English Units 1–4. Not an official Ministry exam. • Works offline / on Netlify.</footer><script>const READINGS=[{"id":"p1","unit":1,"title":"Mariam and the Missing Rabbits","level":"A2.1–A2.2","kind":"Narrative","text":"On Wednesday, Mariam's class visited a wildlife centre to learn about food chains. First, their guide showed them a field with tall grass, rabbits and foxes. The guide explained that grass is a producer. Rabbits eat grass, and foxes hunt rabbits. In this food chain, the rabbit is the fox's prey.\n\nNext, the class walked beside a pond. They watched a small bird eat insects and saw an eagle flying above the trees. The guide explained that these animals were part of a food web because several food chains were connected. Mariam noticed that there were fewer rabbits near the pond than in the field.\n\nThe guide asked, \"What could happen if most of the rabbits disappeared?\" Ali thought the foxes would need to look for other animals to eat. Mariam said that more grass might grow because fewer rabbits would eat it. The guide agreed that changes to one animal could affect several other living things.\n\nOn the bus home, Mariam drew the food chain in her notebook and wrote, \"Every living thing has an important place in nature.\"","words":180,"questions":[{"question":"Where did Mariam’s class go on Wednesday?","options":["To a wildlife centre","To a nature reserve","To an animal farm"],"correct":0,"difficulty":"easy","skill":"Specific information","evidence":"Mariam's class visited a wildlife centre","clue":"Find the place named in the first sentence.","explain":"The first sentence identifies the wildlife centre."},{"question":"Which animal eats the grass in the field?","options":["The fox","The rabbit","The eagle"],"correct":1,"difficulty":"easy","skill":"Specific information","evidence":"Rabbits eat grass, and foxes hunt rabbits.","clue":"Look for the animal directly connected to grass.","explain":"Rabbits eat the grass; foxes hunt the rabbits."},{"question":"What did the small bird eat?","options":["Insects","Seeds","Small fish"],"correct":0,"difficulty":"easy","skill":"Specific information","evidence":"They watched a small bird eat insects","clue":"Look in the paragraph about the pond.","explain":"The bird is described as eating insects."},{"question":"What did Mariam see flying above the trees?","options":["A falcon","An eagle","A hawk"],"correct":1,"difficulty":"easy","skill":"Specific information","evidence":"saw an eagle flying above the trees","clue":"Focus on the animal in the air.","explain":"The passage names an eagle above the trees."},{"question":"Why were these animals part of a food web?","options":["They all followed one food chain","They lived in the same field","Several food chains were connected"],"correct":2,"difficulty":"moderate","skill":"Detail","evidence":"several food chains were connected","clue":"Think about the difference between a single chain and a web.","explain":"A food web connects several chains."},{"question":"What might foxes do if rabbits disappeared?","options":["Hunt fewer animals","Look for other animals to eat","Move only to another field"],"correct":1,"difficulty":"moderate","skill":"Inference","evidence":"foxes would need to look for other animals to eat","clue":"Look at Ali’s prediction after the guide’s question.","explain":"Ali says foxes would search for different prey."},{"question":"Why might more grass grow after many rabbits disappear?","options":["Less grass would be eaten","More sunlight would reach the grass","Other plant eaters would move away"],"correct":0,"difficulty":"challenging","skill":"Cause and effect","evidence":"more grass might grow because fewer rabbits would eat it","clue":"Connect the number of plant eaters to the amount of grass.","explain":"Fewer rabbits means less grass is eaten."},{"question":"Which statement best expresses the main idea?","options":["Different animals live in different habitats","Each species can affect others in a food web","Foxes sometimes change what they hunt"],"correct":1,"difficulty":"challenging","skill":"Overall meaning","evidence":"changes to one animal could affect several other living things","clue":"Use the guide’s lesson and Mariam’s final thought.","explain":"Changes in one species affect others in connected food chains."}]},{"id":"p2","unit":4,"title":"Patterns in Islamic Art","level":"B1.1","kind":"Expository","text":"Islamic art can be seen in mosques, museums and beautiful buildings in many countries. Artists often use geometric shapes, calligraphy and mosaics to decorate walls, floors and doors. These three art forms are different, but they can all include repeating patterns.\n\nGeometric designs use shapes such as circles, squares, triangles and hexagons. Artists repeat or turn the shapes to make complex patterns. Some designs look simple at first, but they contain many smaller shapes. A visitor can sometimes find the same design on a floor and on the wall above it.\n\nCalligraphy is the art of beautiful handwriting. In Islamic buildings, artists may write Arabic words in carefully planned designs. Mosaics are pictures or patterns made from many small pieces of coloured tile or stone. A mosaic may show flowers, leaves or geometric shapes.\n\nOne famous building with beautiful decorations is the Taj Mahal in India. Visitors can see marble, calligraphy and colourful stone designs there. These works of art remind us that mathematics and creativity can work together. Even today, designers study traditional patterns to find ideas for modern buildings and objects.","words":183,"questions":[{"question":"Where can people see Islamic art?","options":["Only in historical buildings","In mosques, museums and buildings","Only in modern art galleries"],"correct":1,"difficulty":"easy","skill":"Detail","evidence":"in mosques, museums and beautiful buildings","clue":"Check the first sentence for locations.","explain":"The first sentence names mosques, museums and buildings."},{"question":"Which shape is mentioned in geometric designs?","options":["Hexagons","Pentagons","Cubes"],"correct":0,"difficulty":"easy","skill":"Detail","evidence":"circles, squares, triangles and hexagons","clue":"Find the list of shapes in paragraph two.","explain":"Hexagons appear in the list of geometric shapes."},{"question":"What is calligraphy?","options":["Art made with repeated shapes","Beautiful artistic handwriting","Pictures made from stone"],"correct":1,"difficulty":"easy","skill":"Detail","evidence":"Calligraphy is the art of beautiful handwriting.","clue":"Look for the sentence that defines this word.","explain":"The text defines calligraphy as beautiful handwriting."},{"question":"What are mosaics made from?","options":["Small pieces of coloured material","Large pieces of painted stone","Single sheets of patterned paper"],"correct":0,"difficulty":"easy","skill":"Detail","evidence":"many small pieces of coloured tile or stone","clue":"Compare the materials described for mosaics.","explain":"Mosaics are made from small pieces of tile or stone."},{"question":"Why might a geometric design look simpler than it really is?","options":["It often uses a small number of colours","It contains many smaller shapes","It is usually viewed from far away"],"correct":1,"difficulty":"moderate","skill":"Inference","evidence":"they contain many smaller shapes","clue":"Look at the contrast between first impressions and detail.","explain":"Smaller shapes make a design more complex than it first appears."},{"question":"What does “complex” suggest about these patterns?","options":["They use detailed arrangements","They are made only from hexagons","They are repeated without any changes"],"correct":0,"difficulty":"moderate","skill":"Vocabulary inference","evidence":"repeat or turn the shapes to make complex patterns","clue":"Look at what artists do with different shapes.","explain":"Repeating and turning shapes produces detailed arrangements."},{"question":"How does Islamic art connect mathematics and creativity?","options":["Artists measure shapes but avoid patterns","Shapes are arranged into artistic designs","Artists copy the same design without changes"],"correct":1,"difficulty":"challenging","skill":"Connections","evidence":"mathematics and creativity can work together","clue":"Link geometric shapes with the final paragraph.","explain":"Geometry and artistic choices are combined in designs."},{"question":"What is the best summary of this text?","options":["Islamic art uses several forms of decoration and patterns","Geometric patterns are the main part of Islamic art","Calligraphy and mosaics appear mainly in India"],"correct":0,"difficulty":"challenging","skill":"Overall meaning","evidence":"geometric shapes, calligraphy and mosaics to decorate","clue":"Choose an idea covering the whole passage, not one building.","explain":"The passage explains three art forms and their patterns."}]},{"id":"p3","unit":1,"title":"A Healthy Lunch Plan","level":"A2.1–A2.2","kind":"Narrative","text":"Aisha used to buy chips and a sweet drink during the school break. She often skipped breakfast because she woke up late. By lunchtime, she felt tired and found it difficult to focus on her lessons. One day, her science teacher asked the class to keep a food diary for a week.\n\nAisha wrote down everything she ate. She noticed that she ate very few vegetables and did not drink enough water. Her teacher explained that a balanced diet should include different kinds of food. Fruit and vegetables provide vitamins, while beans, fish and eggs provide protein.\n\nOn Sunday, Aisha planned a healthier lunch with her mother. First, they made a chicken sandwich with fresh vegetables. Next, they added an apple and a bottle of water. They prepared enough food for one meal, so nothing was wasted.\n\nAfter a few days, Aisha felt more active in class. She still enjoyed a treat sometimes, but she no longer ate chips every day. At the end of the week, she told her friend that small daily choices could help her feel stronger and healthier.","words":182,"questions":[{"question":"What did Aisha usually buy during the school break?","options":["A sandwich and water","Chips and a sweet drink","Fruit and a sweet drink"],"correct":1,"difficulty":"easy","skill":"Specific information","evidence":"buy chips and a sweet drink","clue":"Read the first sentence about the break.","explain":"Her old choice was chips and a sweet drink."},{"question":"Why did Aisha often skip breakfast?","options":["She woke up late","She preferred to eat at lunch","She thought breakfast was unhealthy"],"correct":0,"difficulty":"easy","skill":"Specific information","evidence":"skipped breakfast because she woke up late","clue":"Find the stated reason for missing breakfast.","explain":"She woke up late."},{"question":"What did the teacher ask students to keep?","options":["A food diary","A healthy meal plan","A recipe book"],"correct":0,"difficulty":"easy","skill":"Specific information","evidence":"keep a food diary for a week","clue":"Look at the task given by the science teacher.","explain":"The assignment was a food diary."},{"question":"Which foods are described as sources of protein?","options":["Apples, eggs and fish","Beans, apples and vegetables","Beans, fish and eggs"],"correct":2,"difficulty":"easy","skill":"Specific information","evidence":"beans, fish and eggs provide protein","clue":"Find the sentence that names protein.","explain":"Those three foods are listed as protein sources."},{"question":"What did Aisha and her mother prepare first?","options":["An apple and a bottle of water","A chicken sandwich with vegetables","A vegetable salad and fruit"],"correct":1,"difficulty":"moderate","skill":"Detail","evidence":"First, they made a chicken sandwich with fresh vegetables.","clue":"Follow the sequencing word “First.”","explain":"They started with the sandwich."},{"question":"How did they avoid wasting food?","options":["They prepared just enough for one meal","They used only food left from yesterday","They bought several meals at once"],"correct":0,"difficulty":"moderate","skill":"Detail","evidence":"They prepared enough food for one meal, so nothing was wasted.","clue":"Think about how the amount prepared relates to waste.","explain":"Preparing the needed amount prevented leftovers being thrown away."},{"question":"What can we infer from Aisha’s improvement?","options":["Small changes can improve how someone feels","Preparing meals is more important than breakfast","Drinking water alone can solve tiredness"],"correct":0,"difficulty":"challenging","skill":"Inference","evidence":"After a few days, Aisha felt more active in class.","clue":"Compare Aisha before and after changing her habits.","explain":"Her healthier choices were followed by more energy."},{"question":"Which title gives the main message?","options":["Planning Lunch Saves Time","Healthy Choices Make a Difference","Healthy Food Is Better Than Exercise"],"correct":1,"difficulty":"challenging","skill":"Overall meaning","evidence":"small daily choices could help her feel stronger and healthier","clue":"Use her final conclusion as a guide.","explain":"The story is about the benefits of small healthy changes."}]},{"id":"p4","unit":2,"title":"How Cleaning Robots Help Us","level":"B1.1","kind":"Expository","text":"Cleaning robots are now used in some schools, offices and hospitals. They do not work exactly like people. Instead, they follow instructions from a control system and use sensors to detect objects around them. If a sensor notices a chair, the robot changes direction before touching it.\n\nDifferent parts work together. The power supply provides energy, while the frame supports the other parts. Wheels help the robot move, and a small tool or brush collects dust from the floor. Some robots have a water tank and can wash a floor after collecting the dirt.\n\nRobots can save workers time, especially when they clean long corridors. However, a robot may find stairs difficult, and it cannot always move around toys or bags left on the ground. Someone must also recharge its battery and clean its filter regularly. If the filter becomes blocked, it may stop picking up dirt properly.\n\nEngineers continue to improve these machines. Better sensors can help them move more safely, but robots still need people to check their work. Technology can make daily jobs easier without doing every part of the job for us.","words":186,"questions":[{"question":"Which places are mentioned as using cleaning robots?","options":["Schools, offices and hospitals","Schools, museums and hospitals","Warehouses, offices and airports"],"correct":0,"difficulty":"easy","skill":"Detail","evidence":"schools, offices and hospitals","clue":"Look at the first sentence.","explain":"The text lists these three workplaces."},{"question":"Which part detects objects around the robot?","options":["The frame","The sensor","The control system"],"correct":1,"difficulty":"easy","skill":"Detail","evidence":"use sensors to detect objects around them","clue":"Find what helps the robot notice things.","explain":"Sensors detect objects."},{"question":"What provides energy to the machine?","options":["Power supply","Motor","Control system"],"correct":0,"difficulty":"easy","skill":"Detail","evidence":"The power supply provides energy","clue":"Look at the functions of robot parts.","explain":"The power supply gives energy."},{"question":"What collects dust?","options":["A water tank","A brush or tool","A filter"],"correct":1,"difficulty":"easy","skill":"Detail","evidence":"a small tool or brush collects dust","clue":"Find the part that touches and cleans the floor.","explain":"The brush or tool collects dust."},{"question":"Why are robots useful in long corridors?","options":["They save workers time","They do not need to be recharged","They can clean stairs at the same time"],"correct":0,"difficulty":"moderate","skill":"Detail","evidence":"Robots can save workers time, especially when they clean long corridors.","clue":"Find the benefit in paragraph three.","explain":"Cleaning long corridors can save time."},{"question":"What may happen if a filter is blocked?","options":["It needs less time to clean the floor","It may not pick up dirt properly","It begins to use more water"],"correct":1,"difficulty":"moderate","skill":"Inference","evidence":"If the filter becomes blocked, it may stop picking up dirt properly.","clue":"Think about how a filter affects cleaning.","explain":"A blocked filter reduces cleaning performance."},{"question":"Why do cleaning robots still need human help?","options":["They cannot complete every task or maintain themselves","They need a person to push them along corridors","They can work only on clean floors"],"correct":0,"difficulty":"challenging","skill":"Connections","evidence":"robots still need people to check their work","clue":"Combine the examples about stairs, recharging and filters.","explain":"Robots have limitations and need checks and maintenance."},{"question":"Which statement best summarises the passage?","options":["Robots can help with cleaning, but people are still important","New robots can clean better than people in all places","Cleaning robots are mostly useful in large hospitals"],"correct":0,"difficulty":"challenging","skill":"Overall meaning","evidence":"Technology can make daily jobs easier without doing every part of the job for us.","clue":"Find a statement that includes both the benefit and the limitation.","explain":"The text balances useful technology with the need for human help."}]},{"id":"p5","unit":3,"title":"A Family Trip Across the UAE","level":"A2.1–A2.2","kind":"Narrative","text":"Last winter, Salma's cousin Sara came from another country to visit the UAE for the first time. Salma wanted to show her both modern buildings and traditional places. She planned a three-day trip with her family and wrote the route in a small notebook.\n\nOn the first day, they went to Dubai. Sara enjoyed looking at the tall buildings and visiting a large shopping mall. In the evening, they walked near the sea and took photographs. Sara said that the city was very different from her home town.\n\nThe next morning, the family drove to Ras Al Khaimah. They stopped at a date farm before travelling toward the mountains. Sara learned that dates grow on palm trees and are an important local crop. She loved the cooler air near the mountains.\n\nOn the final day, they visited Sharjah and explored a museum with old objects from the UAE. Sara asked many questions about Emirati life. Before she left, she thanked Salma for choosing such different places. Salma was pleased because her cousin had learned about the country's past and present.","words":180,"questions":[{"question":"Who visited the UAE for the first time?","options":["Salma","Sara","Sara’s mother"],"correct":1,"difficulty":"easy","skill":"Specific information","evidence":"Salma's cousin Sara came from another country to visit the UAE for the first time.","clue":"Find who arrived from another country.","explain":"Sara was the visitor."},{"question":"How many days did Salma plan for the trip?","options":["Two days","Three days","Four days"],"correct":1,"difficulty":"easy","skill":"Specific information","evidence":"She planned a three-day trip","clue":"Find the duration of the trip.","explain":"The plan lasted three days."},{"question":"Where did the family go first?","options":["Dubai","Sharjah","Ras Al Khaimah"],"correct":0,"difficulty":"easy","skill":"Specific information","evidence":"On the first day, they went to Dubai.","clue":"Look for “first day.”","explain":"Dubai was the first stop."},{"question":"What did Sara learn about dates?","options":["They grow on palm trees","They are mainly grown in mountains","They grow best beside the sea"],"correct":0,"difficulty":"easy","skill":"Specific information","evidence":"dates grow on palm trees","clue":"Read the paragraph about the date farm.","explain":"The passage says dates grow on palm trees."},{"question":"Why did the family visit a museum in Sharjah?","options":["To learn about old objects and Emirati life","To compare modern shopping centres","To see mountain pictures from the UAE"],"correct":0,"difficulty":"moderate","skill":"Detail","evidence":"explored a museum with old objects from the UAE","clue":"Think about what a museum shows visitors.","explain":"The museum had historical objects that encouraged questions about Emirati life."},{"question":"Which place had cooler mountain air?","options":["Dubai","Ras Al Khaimah","Sharjah"],"correct":1,"difficulty":"moderate","skill":"Detail","evidence":"She loved the cooler air near the mountains.","clue":"Connect the mountain visit to its emirate.","explain":"The mountain trip followed the stop in Ras Al Khaimah."},{"question":"Why did Salma choose both modern and traditional places?","options":["To show different sides of the UAE","To visit both large and small cities","To compare public transport in each emirate"],"correct":0,"difficulty":"challenging","skill":"Inference","evidence":"show her both modern buildings and traditional places","clue":"Think about what Sara learned at the end.","explain":"Salma wanted Sara to experience the UAE’s past and present."},{"question":"What is the best main idea?","options":["Three places helped a visitor learn about the UAE","A family visited different places to enjoy the weather","A visitor learned mainly about modern cities"],"correct":0,"difficulty":"challenging","skill":"Overall meaning","evidence":"her cousin had learned about the country's past and present.","clue":"Use the purpose and result of the whole journey.","explain":"The trip used several places to introduce the UAE."}]},{"id":"p6","unit":4,"title":"Mathematics in Nature","level":"B1.1","kind":"Expository","text":"Patterns are everywhere in nature. We can see them on animal shells, in flowers and even in the way seeds grow. Some patterns use repeating shapes, while others follow a sequence of numbers. Looking closely at these designs helps scientists ask questions about how living things grow.\n\nOne well-known number pattern is the Fibonacci sequence. Each number after the first two is made by adding the previous two numbers. The sequence begins 0, 1, 1, 2, 3, 5 and 8. Some flowers and pine cones show spiral patterns that can be connected to Fibonacci numbers. A sunflower, for example, has seeds arranged in curves that can be counted.\n\nPeople also create patterns inspired by nature. Architects use repeated shapes in buildings, and artists use circles, squares and hexagons in their designs. Some patterns have symmetry, which means their parts match on opposite sides.\n\nHowever, not every natural pattern follows the Fibonacci sequence exactly. Weather, growing conditions and chance can change the way plants develop. Studying patterns helps us notice relationships, but careful observation is important before we make a scientific claim.","words":181,"questions":[{"question":"Where can patterns appear in nature?","options":["In shells, flowers and seeds","In flowers, rocks and buildings","In shells, buildings and seeds"],"correct":0,"difficulty":"easy","skill":"Detail","evidence":"on animal shells, in flowers and even in the way seeds grow","clue":"Look for the first examples of natural patterns.","explain":"The first paragraph lists shells, flowers and seeds."},{"question":"How is a new Fibonacci number found?","options":["By adding the previous two numbers","By doubling the previous number","By adding the next two numbers"],"correct":0,"difficulty":"easy","skill":"Detail","evidence":"made by adding the previous two numbers","clue":"Read the rule in paragraph two.","explain":"Each number is the sum of the previous two."},{"question":"Which number comes after 5 in the sequence shown?","options":["6","8","9"],"correct":1,"difficulty":"easy","skill":"Detail","evidence":"0, 1, 1, 2, 3, 5 and 8","clue":"Look at the listed sequence.","explain":"Eight follows five."},{"question":"Which plant is mentioned as having curved seed patterns?","options":["Sunflower","Pine cone","Rose bush"],"correct":0,"difficulty":"easy","skill":"Detail","evidence":"A sunflower, for example, has seeds arranged in curves","clue":"Look for the example involving seeds.","explain":"The sunflower is the example."},{"question":"What does symmetry mean in this passage?","options":["Parts match on opposite sides","Shapes repeat at equal distances","All shapes contain the same number of sides"],"correct":0,"difficulty":"moderate","skill":"Detail","evidence":"their parts match on opposite sides","clue":"Find the explanation of the design property.","explain":"Symmetry means opposite sides match."},{"question":"Why can some plant patterns change?","options":["Growing conditions and weather may change them","Every plant begins with a different number sequence","Human-made buildings can influence them"],"correct":0,"difficulty":"moderate","skill":"Inference","evidence":"Weather, growing conditions and chance can change the way plants develop.","clue":"Look at the final paragraph for reasons.","explain":"Natural conditions can change how plants grow."},{"question":"Why does the writer say careful observation is important?","options":["Patterns do not always follow one rule exactly","Patterns are difficult to see without tools","Artists sometimes use patterns incorrectly"],"correct":0,"difficulty":"challenging","skill":"Connections","evidence":"not every natural pattern follows the Fibonacci sequence exactly","clue":"Connect the warning with the final sentence.","explain":"We should check evidence instead of assuming every pattern matches a rule."},{"question":"What is the main purpose of the text?","options":["To explain different patterns and why they are studied","To compare patterns in plants and in buildings","To teach how to find the Fibonacci numbers in flowers"],"correct":0,"difficulty":"challenging","skill":"Overall meaning","evidence":"Studying patterns helps us notice relationships","clue":"Find an idea that covers all three sections.","explain":"The passage explores natural and designed patterns and their significance."}]}];</script><script>
const SETS=[{title:'Mock 1 · Exam themes',subtitle:'Food chains (A2 narrative) + Islamic Art (B1 informational)',ids:['p1','p2'],badge:'Closest to official reading themes'},{title:'Mock 2 · Healthy Living & Robots',subtitle:'Healthy food (A2 narrative) + Cleaning robots (B1 informational)',ids:['p3','p4'],badge:'Units 1 and 2 review'},{title:'Mock 3 · UAE & Nature',subtitle:'Visiting the UAE (A2 narrative) + Patterns in nature (B1 informational)',ids:['p5','p6'],badge:'Units 3 and 4 review'}];
const STORE={getItem(k){try{return window.localStorage.getItem(k)}catch(e){return null}},setItem(k,v){try{window.localStorage.setItem(k,v)}catch(e){}}};const esc=s=>String(s??'').replaceAll('&','&amp;').replaceAll('<','&lt;').replaceAll('>','&gt;').replaceAll('"','&quot;').replaceAll("'",'&#39;');const $=id=>document.getElementById(id);let page='home',session=null,tick=null;
function clock(ms){let s=Math.max(0,Math.ceil(ms/1000));return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function nav(){const data=[['home','🏠 Practice sets'],['skills','🧭 Reading strategies']];$('nav').innerHTML=data.map(([id,label])=>`<button class="${page===id?'active':''}" data-nav="${id}">${label}</button>`).join('');document.querySelectorAll('[data-nav]').forEach(b=>b.onclick=()=>{if(session&&!session.done&&!confirm('Leave your timed reading practice?'))return;clearInterval(tick);session=null;page=b.dataset.nav;render();});}
function hero(){return `<div class="hero"><div class="hero-copy"><div class="eyebrow">Read • find the clue • prove your answer</div><h1>Reading Detective <span style="color:#b8ffdd">Lab</span></h1><p>Read original exam-style passages and use text evidence to understand every mistake. Choose A, B or C, then learn how to find the answer in the passage.</p><div class="hero-stats"><span class="stat">📖 6 passages</span><span class="stat">✅ 48 MCQs</span><span class="stat">⏱️ 60 minutes / mock</span><span class="stat">🔎 Clues + evidence</span></div></div></div>`}
function startScreen(){ $('app').innerHTML=hero()+`<div class="sectionbar"><div><h2>Choose a full reading mock</h2><p>Each mock matches the assessment structure: <strong>Part 3A: 8 questions × 3 marks</strong> and <strong>Part 3B: 8 questions × 2 marks</strong>, total /40.</p></div></div><div class="card pad" style="margin-bottom:16px"><div class="form-row"><label class="field">Student name (optional)<input id="student" maxlength="80" placeholder="Student name"></label><label class="field">Class (optional)<input id="klass" maxlength="20" placeholder="7 / 2"></label><div class="notice">⏱️ The 60-minute timer starts when you choose a mock. Wrong answers reveal a clue and quoted evidence; students can try again for half marks.</div></div></div><div class="setup-grid">${SETS.map((set,i)=>`<section class="card mode-card"><div class="mode-art">${['🌿','🤖','🕌'][i]}</div><span class="pill">${esc(set.badge)}</span><h3>${esc(set.title)}</h3><p>${esc(set.subtitle)}</p><div class="badgelist"><span class="pill easy">Easy</span><span class="pill moderate">Moderate</span><span class="pill challenging">Challenging</span></div><button class="cta primary" data-start="${i}">Start reading mock →</button></section>`).join('')}</div><div class="notice" style="margin-top:22px"><strong>How this mirrors the final assessment:</strong> A2 narrative passages and B1 expository passages (around 180 words), three plausible answer options, and comprehension questions on specific information, details, inference, connections and main idea. Mock 1 uses the official food-chain and patterns/Islamic-art themes; Mocks 2–3 reinforce the other units.</div>`;
document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{let set=SETS[+b.dataset.start],ps=set.ids.map(id=>READINGS.find(x=>x.id===id));session={set,passages:ps,idx:0,score:0,questions:ps.flatMap((p,i)=>p.questions.map((q,j)=>({...q,source:p.id,passage:i,number:j+1,weight:i===0?3:2,tries:0,resolved:false,awarded:0}))),start:Date.now(),end:Date.now()+3600000,done:false,name:$('student').value.trim(),className:$('klass').value.trim(),wrong:[],highlight:''};page='quiz';startTimer();renderQuestion();});}
function startTimer(){clearInterval(tick);tick=setInterval(()=>{if(!session||session.done)return;if(session.end<=Date.now()){finish('The 60-minute timer has ended.');return}let el=$('timer');if(el){el.textContent=clock(session.end-Date.now());el.classList.toggle('low',session.end-Date.now()<600000)}},350)}
function passageHtml(txt,evidence){let safe=esc(txt);if(evidence){const chunk=esc(evidence);if(safe.includes(chunk))safe=safe.replace(chunk,`<mark class="mark">${chunk}</mark>`);}return safe.split(/\n\n/).map(p=>`<p>${p}</p>`).join('')}
function renderQuestion(){const q=session.questions[session.idx],p=READINGS.find(x=>x.id===q.source),finished=session.questions.filter(x=>x.resolved).length;let change=q.passage>0&&session.idx===8;
 $('app').innerHTML=`<div class="sectionbar"><div><button class="back" id="exit">← Return to reading sets</button><h2>${esc(session.set.title)}</h2><p>Find the answer in the text before choosing an option.</p></div><span class="pill">${q.passage===0?'Part 3A • Narrative':'Part 3B • Informational'}</span></div><div class="progress-track"><div class="progress-fill" style="width:${finished/16*100}%"></div></div><div class="reading-shell"><article class="card pad reading-panel" id="textpanel"><div class="sectionbar" style="margin:0 0 10px"><div><span class="pill">Unit ${p.unit} • ${esc(p.level)} • ${p.words} words</span><h2 style="font-size:1.23rem;margin-top:7px">${esc(p.title)}</h2></div></div><div class="passage" id="passage">${passageHtml(p.text,session.highlight)}</div></article><section class="card pad read-q"><div class="sectionbar" style="margin:0"><span class="pill ${q.difficulty}">${esc(q.difficulty)} · ${esc(q.skill)}</span><span class="pill">${q.weight} marks</span></div><div style="display:flex;align-items:center;justify-content:space-between;margin-top:13px"><strong>Question ${session.idx+1} / 16</strong><span class="timer" id="timer">${clock(session.end-Date.now())}</span></div><div class="question">${esc(q.question)}</div><div class="options">${q.options.map((o,i)=>`<button class="option" data-choice="${i}"><span class="letter">${'ABC'[i]}</span><span>${esc(o)}</span></button>`).join('')}</div><div id="feedback"></div><div class="hide" id="nextr" style="margin-top:18px"><button class="cta primary" id="next">${session.idx===15?'See your final score':'Next question →'}</button></div><p class="helptext" style="margin-top:18px">${session.score} / 40 marks so far · Evidence is highlighted in yellow after an incorrect answer.</p></section></div>`;$('exit').onclick=()=>{if(confirm('Exit this timed mock?')){clearInterval(tick);session=null;page='home';render()}};document.querySelectorAll('[data-choice]').forEach(b=>b.onclick=()=>answer(+b.dataset.choice));}
function answer(choice){const q=session.questions[session.idx];if(q.resolved||Date.now()>=session.end)return;q.tries++;const buttons=[...document.querySelectorAll('[data-choice]')];if(choice===q.correct){q.resolved=true;q.awarded=q.tries===1?q.weight:q.weight/2;session.score+=q.awarded;buttons.forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('selected')});$('feedback').innerHTML=`<div class="feedback"><h3>✅ Correct! +${q.awarded} marks</h3><p>${esc(q.explain)}</p><p><strong>Text evidence:</strong></p><div class="evidence">“${esc(q.evidence)}”</div></div>`;$('nextr').classList.remove('hide');$('next').onclick=next;}
else if(q.tries===1){session.wrong.push({passage:q.source,question:q.question,correct:q.options[q.correct],chosen:q.options[choice],evidence:q.evidence});buttons[choice].disabled=true;buttons[choice].classList.add('wrong');session.highlight=q.evidence;$('passage').innerHTML=passageHtml(READINGS.find(p=>p.id===q.source).text,q.evidence);$('feedback').innerHTML=`<div class="feedback bad"><h3>🔎 Detective clue — look again!</h3><p><strong>Clue:</strong> ${esc(q.clue)}</p><p><strong>Evidence from the passage:</strong></p><div class="evidence">“${esc(q.evidence)}”</div><p class="helptext">The evidence is highlighted in yellow on the left. You have one more chance for half marks.</p></div>`;}
else {q.resolved=true;buttons.forEach((b,i)=>{b.disabled=true;if(i===q.correct)b.classList.add('selected');if(i===choice)b.classList.add('wrong')});$('feedback').innerHTML=`<div class="feedback bad"><h3>📘 Learn from the evidence</h3><p><strong>Best answer:</strong> ${esc(q.options[q.correct])}</p><p>${esc(q.explain)}</p><div class="evidence">“${esc(q.evidence)}”</div></div>`;$('nextr').classList.remove('hide');$('next').onclick=next;}}
function next(){if(session.idx===15){finish('Reading mock complete!');return}session.idx++;session.highlight='';renderQuestion();}
function finish(msg){if(!session)return;clearInterval(tick);session.done=true;page='results';const done=session.questions.filter(q=>q.resolved).length,pct=Math.round(session.score/40*100),report={name:session.name||'Student',class:session.className||'',mock:session.set.title,score:session.score,max:40,completed:done,questions:16,wrong:session.wrong.length,date:new Date().toISOString()};STORE.setItem('g7_last_reading',JSON.stringify(report));$('app').innerHTML=`<div class="card results" style="max-width:850px;margin:36px auto"><div style="font-size:67px">${pct>=80?'🏆':pct>=60?'🌟':'🔎'}</div><h2>${esc(msg)}</h2><p>${esc(session.set.title)}</p><div class="big">${session.score} / 40</div><h3>${pct}% · ${done} of 16 answered</h3><p class="muted">${esc(session.name||'Student')} · Review the evidence for questions you missed.</p><div class="filters" style="justify-content:center;margin:24px 0"><button class="cta primary" id="retry">Choose another mock</button><button class="cta soft" id="dl">Save result as CSV</button><button class="cta outline" id="print">Print result</button></div>${session.wrong.length?`<div style="text-align:left;border-top:1px solid #e0ebe6;padding-top:18px"><h3>🔁 Evidence review (${session.wrong.length} first-attempt errors)</h3>${session.wrong.map((w,i)=>`<div class="feedback bad"><p><strong>${i+1}. ${esc(w.question)}</strong></p><p>Correct answer: ${esc(w.correct)}</p><div class="evidence">“${esc(w.evidence)}”</div></div>`).join('')}</div>`:'<p>Excellent work — no first-attempt mistakes were recorded.</p>'}</div>`;$('retry').onclick=()=>{session=null;page='home';render()};$('print').onclick=()=>print();$('dl').onclick=()=>{let csv='Student,Class,Mock,Score,Maximum,Answered,Questions,First-attempt Errors,Date\n'+[report.name,report.class,report.mock,report.score,40,done,16,report.wrong,report.date].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')+'\n';let blob=new Blob([csv],{type:'text/csv;charset=utf-8'}),a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='Grade7_Reading_Result.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500)};nav();}
function strategies(){ $('app').innerHTML=hero()+`<div class="sectionbar"><div><h2>🧭 Reading detective strategies</h2><p>Use the same skills that appear in the Grade 7 reading test specification.</p></div></div><div class="grid">${[['🔍','Specific information','Read the question first. Circle a key word, then scan the text for that detail.','ابحثي عن الكلمة المفتاحية أولاً.'],['📎','Details','Read the whole sentence and the one before or after it. Avoid choosing an answer just because one word matches.','اقرئي الجملة وما قبلها أو بعدها.'],['💡','Inference','Ask: what does the writer suggest without saying directly? Combine clues.','استنتجي المعنى من الدليل.'],['🧩','Connections','Link two pieces of information. Notice cause and effect.','اربطي بين فكرتين في النص.'],['🎯','Overall meaning','Choose the option that covers the entire passage, not just one small detail.','اختاري الفكرة التي تلخص النص كله.'],['📖','Unknown words','Use neighbouring words to decide what a difficult word means.','استخدمي السياق لمعرفة المعنى.']].map(s=>`<article class="card pad"><div class="mode-art">${s[0]}</div><h3>${s[1]}</h3><p>${s[2]}</p><p class="arabic" lang="ar">${s[3]}</p></article>`).join('')}</div>`;}
function render(){nav();if(page==='skills')strategies();else startScreen()};render();
</script></body></html>
