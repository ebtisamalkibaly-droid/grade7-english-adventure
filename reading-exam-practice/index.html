.exam-head{padding:22px 0 14px}.crumb{border:0;background:none;color:var(--green);font-weight:800;padding:3px 0;margin-bottom:9px}.crumb:hover{text-decoration:underline}.exam-title{font-size:clamp(1.55rem,3vw,2.35rem);letter-spacing:-.7px;line-height:1.24;margin:3px 0 7px}.exam-head .subtext{margin-bottom:17px}.exam-toolbar{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:14px}.tool-chip{border:1px solid #d6e5de;background:white;border-radius:11px;padding:8px 12px;font-weight:700;font-size:.85rem}.tool-chip.mint{background:#e8f6ee;color:#117058;border-color:#c4e7d7}.outline{border:1px solid #9dcab9;border-radius:11px;background:white;padding:8px 12px;color:#0b644f;font-weight:800}.outline:hover{background:#e9f6ef}.exam-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.04fr);align-items:start;gap:17px}.reading-panel,.questions-panel{background:white;border:1px solid var(--line);border-radius:19px;box-shadow:0 7px 20px rgba(14,70,52,.035);overflow:hidden}.panel-header{background:#e9f5ef;border-bottom:1px solid #d2e7dc;padding:17px 21px;display:flex;align-items:center;justify-content:space-between;gap:8px}.panel-header h2{margin:0;font-size:1.07rem}.panel-header span{font-size:.79rem;color:#386d5c;font-weight:800}.reading-body{padding:18px 23px 27px;font-size:1.02rem;line-height:1.9}.reading-body p{margin:0 0 17px}.para-num{font-size:.72rem;display:inline-flex;align-items:center;justify-content:center;background:#f0f3ee;color:#617b70;border-radius:6px;min-width:23px;height:23px;margin-right:9px;vertical-align:1px;font-weight:800}.reading-body mark{background:#fff0b1;border-bottom:2px solid #dc9426;border-radius:2px;padding:2px 1px}.questions-list{padding:13px 17px}.q-block{padding:17px 11px 20px;border-bottom:1px solid #ebf0ec;scroll-margin-top:85px}.q-block:last-child{border:0}.q-head{display:flex;align-items:start;gap:11px;margin-bottom:11px}.q-number{display:grid;place-items:center;width:29px;height:29px;border-radius:9px;background:#e6f3ed;color:var(--deep);font-weight:900;flex:none}.q-head strong{font-size:.97rem;line-height:1.48;padding-top:2px}.choices{display:grid;gap:8px;margin-left:40px}.option{border:1px solid #d7e4dd;border-radius:12px;display:flex;align-items:start;gap:11px;padding:11px 12px;cursor:pointer;background:white;transition:.16s}.option:hover{background:#f3faf6;border-color:#b3dac8}.option:has(input:checked){border-color:#168468;background:#eaf7f0;box-shadow:inset 0 0 0 1px #168468}.option input{accent-color:#097055;margin-top:5px;flex:none}.option-text{font-size:.91rem;line-height:1.5}.option-letter{font-weight:850;color:var(--green);margin-right:4px}.option.correct{border-color:#a4d4bd;background:#ebf8ee}.option.wrong{border-color:#e9b9b2;background:#fff0ed}.option.review-only{cursor:default}.answer-review{margin:13px 0 0 40px;border-left:3px solid #78b99a;padding:8px 12px;background:#f1faf4;border-radius:0 10px 10px 0;font-size:.87rem;line-height:1.63}.answer-review.incorrect{border-color:#d17d6b;background:#fff5f2}.review-tag{font-size:.77rem;font-weight:900;letter-spacing:.1px;margin-bottom:4px}.evidence-quote{margin:9px 0 7px;color:#235a49;font-size:.88rem;font-style:italic}.evidence-btn{border:0;background:none;color:#075d4b;font-weight:900;padding:4px 0;font-size:.82rem;text-decoration:underline;text-underline-offset:3px}.submit-area{display:flex;align-items:center;gap:15px;justify-content:space-between;flex-wrap:wrap;background:#f7fbf8;padding:17px 22px;border-top:1px solid var(--line)}.primary{border:0;border-radius:12px;background:var(--green);color:white;padding:12px 24px;font-weight:850}.primary:disabled{opacity:.5}.secondary{border:1px solid #add2c3;border-radius:12px;background:white;color:var(--green);padding:11px 19px;font-weight:850}.secondary:hover{background:#eef8f3}.score-banner{border:1px solid #c1e3ce;background:#edfaef;border-radius:17px;padding:21px 24px;margin:0 0 16px;display:flex;align-items:center;justify-content:space-between;gap:18px;flex-wrap:wrap}.score-banner h2{margin:0;font-size:1.29rem}.score-banner p{margin:3px 0 0;font-size:.88rem;color:#456c55}.bigscore{font-size:2.2rem;font-weight:900;color:#116748;letter-spacing:-1.3px}.score-actions{display:flex;gap:9px;flex-wrap:wrap}.notice{padding:12px 16px;border-radius:12px;background:#fff7e9;color:#7e612c;border:1px solid #f5dcaa;font-size:.84rem;margin:14px 0}.progress-track{height:7px;border-radius:99px;background:#e6f0e9;overflow:hidden;margin:10px 0 0}.progress-fill{height:100%;background:linear-gradient(90deg,#0b755d,#30a38b);transition:width .2s}.timer-on{background:#fff1d4;border-color:#e7ca91;color:#76521e}.muted{color:var(--muted)}.print-heading{display:none}

@media print{body{background:white;color:#000;font-size:12pt} .topbar,.hero,.site-footer,.exam-toolbar,.crumb,.submit-area,.score-banner,.answer-review,.notice,.hint,.cardgrid,.main-title{display:none!important}.wrap{width:100%;padding:0}.exam-head{padding:0 0 12px}.exam-title{font-size:18pt}.print-heading{display:block;font-size:10pt;border-bottom:1px solid #888;padding-bottom:10px;margin:0 0 12px}.exam-layout{display:block}.reading-panel,.questions-panel{border:0;box-shadow:none;break-inside:auto}.reading-body{padding:6px 2px 8px;font-size:10.3pt;line-height:1.48}.reading-body p{margin:0 0 8px}.panel-header{background:white;border:0;padding:8px 0 5px}.panel-header h2{font-size:12pt}.questions-list{padding:0}.q-block{break-inside:avoid;padding:8px 0;border-bottom:0}.q-head{margin:0 0 3px}.q-head strong{font-size:10pt}.q-number{width:20px;height:20px;border:1px solid #555;background:white;border-radius:3px;font-size:9pt}.choices{margin:0 0 0 29px;gap:2px;display:block}.option{border:0;padding:0 0 2px;background:white!important;min-height:auto}.option input{display:none}.option:has(input:checked){box-shadow:none;border:0}.option-text{font-size:9.5pt}.option-letter{color:#000}.reading-body mark{background:none;border:0}.questions-panel{page-break-before:auto}.exam-head .subtext{font-size:9pt}.page-break{break-before:page}}

<script>
const PRACTICES=[{"id":1,"title":"The Language of Shapes","subtitle":"Understanding geometric art","paragraphs":["Visitors to a mosque in Sharjah may notice patterns before they notice anything else. A wall can be covered with blue and white tiles arranged in repeating stars. The artist uses the same shapes again and again, but the result does not look boring. Instead, each line leads the eye towards another part of the design.","Geometric art begins with simple shapes such as circles, squares, and triangles. Artists draw guidelines to make sure shapes connect without leaving unwanted spaces. A small change in angle can produce a completely different star. This careful planning helps large patterns look balanced from one side to the other.","Patterns are not used only on walls. They can appear on wooden doors, glass windows, carpets, and books. Some designs include calligraphy, which turns beautifully written words into decoration. Other designs use flowers and leaves, helping visitors see a connection between art and nature.","Today, students use rulers or computer programs to make their own designs. They discover that creating a pattern needs both imagination and mathematical thinking. When they look closely at an old building, they can see the patience and skill behind its beauty."],"questions":[{"skill":"Detail","prompt":"Which colours are used for the tiles described in the first paragraph?","options":["Blue and green","Blue and white","Green and white"],"answer":1,"evidence":"blue and white tiles arranged in repeating stars","why":"The first paragraph names both colours directly."},{"skill":"Detail","prompt":"Why do artists draw guidelines?","options":["To help shapes connect correctly","To plan which colours to use","To draw each line with a ruler"],"answer":0,"evidence":"Artists draw guidelines to make sure shapes connect without leaving unwanted spaces.","why":"The guidelines help artists organise connected shapes."},{"skill":"Inference","prompt":"What can readers infer about changing the angle of a line?","options":["It can change the final design greatly.","It always gives the star more sides","It changes only the colour of the star"],"answer":0,"evidence":"A small change in angle can produce a completely different star.","why":"Even a small change may produce a new shape."},{"skill":"Detail","prompt":"Where else can these patterns appear besides walls?","options":["On stone pathways and ceilings","On museum signs and outdoor steps","On doors and carpets"],"answer":2,"evidence":"They can appear on wooden doors, glass windows, carpets, and books.","why":"The passage lists doors and carpets among several places."},{"skill":"Main Idea","prompt":"What is the passage mainly about?","options":["How building materials have changed","How new technology copies old buildings","How repeated shapes make meaningful designs"],"answer":2,"evidence":"They discover that creating a pattern needs both imagination and mathematical thinking.","why":"The passage explains the shapes, planning and creativity behind geometric art."},{"skill":"Inference","prompt":"Why might a teacher use pattern drawing in a maths lesson?","options":["To compare the sizes of different tiles","It connects creativity with shapes and angles.","To practise measuring building heights"],"answer":1,"evidence":"They discover that creating a pattern needs both imagination and mathematical thinking.","why":"Art and mathematical thinking are connected in the design process."},{"skill":"Detail","prompt":"What does calligraphy add to some designs?","options":["A different colour for each line","Beautifully written words","Traditional shapes made from leaves"],"answer":1,"evidence":"Some designs include calligraphy, which turns beautifully written words into decoration.","why":"Calligraphy is decorative writing."},{"skill":"Connection","prompt":"A student wants to make a balanced star pattern. What should she do first?","options":["Draw guidelines for the shapes","Copy one star and leave the spaces between shapes empty","Begin with colours, then add shapes without a plan"],"answer":0,"evidence":"Artists draw guidelines to make sure shapes connect without leaving unwanted spaces.","why":"Planning with guidelines is the strategy the passage recommends."}]},{"id":2,"title":"A Mosaic Made by Hand","subtitle":"How small pieces create a larger design","paragraphs":["A mosaic is a picture or pattern made from many small pieces of material. In some Islamic buildings, artists arrange colourful tiles into stars, borders, and other geometric designs. From far away, a wall may look like one large picture. Up close, visitors can see that hundreds of separate pieces fit together carefully.","Before beginning, an artisan plans the pattern on paper. The artisan chooses colours and checks the size of each piece. Some tiles must be cut so they fit beside other shapes without leaving large gaps. This work takes time because one misplaced piece can affect the next row.","The materials also matter. Tiles may be used on walls and floors because their hard surfaces are relatively easy to clean. Wood can create beautiful patterns too, but it needs different tools and care. A skilled artisan understands how each material changes the design process.","Although modern machines can cut tiles quickly, some workshops still teach traditional methods. Young people learn to measure, arrange, and check each piece by hand. The finished mosaic reminds them that a large work of art is created through many small, accurate decisions."],"questions":[{"skill":"Detail","prompt":"What makes up a mosaic?","options":["Several large pieces of cut stone","One continuous painted surface","Many small pieces of material"],"answer":2,"evidence":"A mosaic is a picture or pattern made from many small pieces of material.","why":"A mosaic is built from separate small pieces."},{"skill":"Detail","prompt":"What does an artisan do before starting the mosaic?","options":["Plans the pattern on paper","Select the colours and place pieces immediately","Cut every piece before deciding on the pattern"],"answer":0,"evidence":"Before beginning, an artisan plans the pattern on paper.","why":"Planning comes before arranging the pieces."},{"skill":"Inference","prompt":"Why can one misplaced tile cause a problem?","options":["The pattern may need fewer colours","The next pieces may not fit correctly.","The completed design may take less time"],"answer":1,"evidence":"one misplaced piece can affect the next row.","why":"Rows depend on the accurate position of earlier pieces."},{"skill":"Detail","prompt":"Why are tiles useful on walls and floors?","options":["Their surface can be repaired easily","Their hard surfaces are easy to clean.","They can be shaped without any tools"],"answer":1,"evidence":"Tiles may be used on walls and floors because their hard surfaces are relatively easy to clean.","why":"The author identifies a practical benefit of tiles."},{"skill":"Main Idea","prompt":"What is the best summary of the passage?","options":["Modern machines have made planning unnecessary","Mosaics use the same process for all materials","Mosaics need careful planning and many precise steps."],"answer":2,"evidence":"The finished mosaic reminds them that a large work of art is created through many small, accurate decisions.","why":"The main message is the careful process of creating mosaics."},{"skill":"Inference","prompt":"Why do some workshops continue teaching work by hand?","options":["To protect useful traditional skills","To make larger tiles more quickly","To ensure every finished design looks identical"],"answer":0,"evidence":"some workshops still teach traditional methods. Young people learn to measure, arrange, and check each piece by hand.","why":"Handwork passes traditional craft knowledge to younger learners."},{"skill":"Detail","prompt":"What may need to happen to some tiles?","options":["They must be cut to fit.","They may need a different colour","They may need a different material"],"answer":0,"evidence":"Some tiles must be cut so they fit beside other shapes without leaving large gaps.","why":"Cutting helps tiles fit together."},{"skill":"Connection","prompt":"A group is making a class mosaic. What should they do to avoid gaps?","options":["Glue down every tile before checking the size","Measure and check their pieces","Choose colours before deciding on a design"],"answer":1,"evidence":"The artisan chooses colours and checks the size of each piece.","why":"Checking sizes improves accuracy and reduces gaps."}]},{"id":3,"title":"Patterns Above Our Heads","subtitle":"Domes, windows and light","paragraphs":["When visitors enter a building with a large dome, they often look up. A dome is a rounded roof that can cover a wide space without filling the centre with walls. In some mosques, artists decorate the inside of the dome with circles, stars, and repeated lines. The design draws attention towards its highest point.","Artists sometimes divide a dome into equal sections before adding details. This allows the same shape to repeat around the centre. If the sections do not match, the pattern may appear uneven. Planning is especially important because people can see much of the design from the floor below.","Windows can add another kind of pattern. When sunlight passes through a decorated screen, it creates shapes of light and shadow on the floor. As the sun moves across the sky, the shadows change position. The building seems to have a new design at different times of day.","These features show that patterns are not limited to flat drawings. A roof, a window, and even moving sunlight can become parts of an artistic experience. Visitors may enjoy the colours first, but a closer look reveals careful work with shape, space, and light."],"questions":[{"skill":"Detail","prompt":"What is a dome?","options":["A decorative design on a floor","A curved opening in a wall","A rounded roof"],"answer":2,"evidence":"A dome is a rounded roof that can cover a wide space without filling the centre with walls.","why":"The passage defines a dome in paragraph one."},{"skill":"Detail","prompt":"Why do artists divide a dome into equal sections?","options":["To repeat shapes around the centre","To make each repeated shape a different size","To allow different colours in every section"],"answer":0,"evidence":"This allows the same shape to repeat around the centre.","why":"Equal sections support a repeating design."},{"skill":"Inference","prompt":"What is likely to happen if the dome sections do not match?","options":["The design may look uneven.","The sections may use different colours","The dome may look smaller from below"],"answer":0,"evidence":"If the sections do not match, the pattern may appear uneven.","why":"Unequal parts may interrupt the repeating pattern."},{"skill":"Detail","prompt":"What creates shapes of light and shadow on the floor?","options":["A mirror placed beside a doorway","A decorated window screen","Painted lines on the dome"],"answer":1,"evidence":"When sunlight passes through a decorated screen, it creates shapes of light and shadow on the floor.","why":"The screen and sunlight form the shadow pattern."},{"skill":"Main Idea","prompt":"What is the main message of the passage?","options":["Traditional buildings need fewer walls","Buildings use patterns in shapes, spaces and light.","Architects always design windows before roofs"],"answer":1,"evidence":"A roof, a window, and even moving sunlight can become parts of an artistic experience.","why":"The passage connects several building features to patterned art."},{"skill":"Inference","prompt":"Why might a visitor see different shadows during the afternoon?","options":["The decorated screen changes its shape","The dome becomes brighter as people enter","The sun changes position."],"answer":2,"evidence":"As the sun moves across the sky, the shadows change position.","why":"Changes in sunlight change where the shadows fall."},{"skill":"Detail","prompt":"Where are some dome decorations placed?","options":["Inside the dome","In the centre of the floor","On the outside of the windows"],"answer":0,"evidence":"artists decorate the inside of the dome with circles, stars, and repeated lines.","why":"The text explicitly describes decoration inside the dome."},{"skill":"Connection","prompt":"A student wants shifting patterns in a school model. Which feature would help most?","options":["A smooth screen with no cut-out shapes","A patterned screen near a light source","A patterned carpet placed below a skylight"],"answer":1,"evidence":"When sunlight passes through a decorated screen, it creates shapes of light and shadow on the floor.","why":"A patterned screen and light can reproduce this effect."}]},{"id":4,"title":"The Art of the Garden","subtitle":"Repeating designs outdoors","paragraphs":["Patterns can be found outside buildings as well as inside them. In a carefully planned garden, paths may cross to form four equal areas. Trees or flowers can be placed in rows, while water channels lead the eye towards a central fountain. These features help visitors notice order in a natural space.","Garden designers think about both appearance and movement. A path must be wide enough for people to walk comfortably, but it may also form part of a larger geometric design. Repeated plants can make two sides look balanced. However, the garden does not stay exactly the same throughout the year.","As plants grow, some shapes become less clear. Gardeners trim branches and replace unhealthy plants to protect the original arrangement. They also choose plants suited to the local weather, because a beautiful design is not useful if the plants cannot survive.","A garden pattern is therefore different from a pattern painted on a wall. It changes with the seasons and needs regular care. Still, both designs combine planning with repetition. The result invites people to slow down and notice relationships between shapes and the world around them."],"questions":[{"skill":"Detail","prompt":"How may paths divide the garden?","options":["Into two equal areas along one path","Into four equal areas","Into four areas of different sizes"],"answer":1,"evidence":"paths may cross to form four equal areas.","why":"Crossing paths can make four parts."},{"skill":"Detail","prompt":"What may be placed in rows?","options":["Stones of different shapes","Different sizes of fountains","Trees or flowers"],"answer":2,"evidence":"Trees or flowers can be placed in rows","why":"Plants form part of the garden pattern."},{"skill":"Inference","prompt":"Why does the garden need more care than a wall pattern?","options":["The plants grow and change.","Stone paths can become difficult to walk on","The fountain may stop working in summer"],"answer":0,"evidence":"As plants grow, some shapes become less clear.","why":"Living plants change over time and need maintenance."},{"skill":"Detail","prompt":"What do gardeners do to protect the design?","options":["Trim branches and replace unhealthy plants","Move the central fountain regularly","Change the paths each month"],"answer":0,"evidence":"Gardeners trim branches and replace unhealthy plants to protect the original arrangement.","why":"The third paragraph describes garden maintenance."},{"skill":"Main Idea","prompt":"What does the passage mainly explain?","options":["How fountains replace trees in gardens","How geometric planning creates and maintains garden patterns","Why patterned paths are always straight"],"answer":1,"evidence":"Still, both designs combine planning with repetition.","why":"The text explains planned patterns in living outdoor spaces."},{"skill":"Inference","prompt":"Why must designers consider the local weather?","options":["The local weather determines the path width","Flowers must all grow at the same speed","Plants need suitable conditions to survive."],"answer":2,"evidence":"They also choose plants suited to the local weather, because a beautiful design is not useful if the plants cannot survive.","why":"A design must work with the environment."},{"skill":"Detail","prompt":"What might guide visitors’ eyes towards the fountain?","options":["Water channels","Repeated plants around the entrance","A row of flowering trees beside a path"],"answer":0,"evidence":"water channels lead the eye towards a central fountain.","why":"The passage directly describes the purpose of channels."},{"skill":"Connection","prompt":"A school wants a balanced outdoor pattern. Which plan suits the passage best?","options":["Keep each side different to create contrast","Place repeated plants on both sides of a path","Choose different flowers for every section"],"answer":1,"evidence":"Repeated plants can make two sides look balanced.","why":"Repeated planting can help create visual balance."}]},{"id":5,"title":"Beautiful Words in Art","subtitle":"Understanding calligraphy","paragraphs":["Calligraphy is the art of beautiful handwriting. It has an important place in many examples of Islamic art. Instead of using letters only to share information, calligraphers also consider the shape of every line. Words may become part of a border, a page, or a decoration above a doorway.","Before writing, an artist decides how much space is available. Large letters may need more room than small ones, while curves and straight lines must work together. The artist often practises the design several times. A beautiful result depends on control, patience, and the careful placement of each letter.","Calligraphy can also appear beside geometric or floral patterns. The shapes around the writing may repeat, but the words carry their own message. This combination allows the artist to connect visual beauty with language and meaning. Viewers may appreciate the design even before they understand the written words.","Today, young artists can learn calligraphy using pens, paper, or digital tools. Technology may help them test different arrangements, but it does not remove the need to make thoughtful choices. When students study calligraphy, they discover that writing can communicate through both its message and its appearance."],"questions":[{"skill":"Detail","prompt":"What is calligraphy?","options":["The art of choosing decorative colours","The study of shapes on walls","The art of beautiful handwriting"],"answer":2,"evidence":"Calligraphy is the art of beautiful handwriting.","why":"The definition is given at the start."},{"skill":"Detail","prompt":"Where might calligraphic words appear?","options":["In borders around windows","Above a doorway","On the surface of garden paths"],"answer":1,"evidence":"Words may become part of a border, a page, or a decoration above a doorway.","why":"The passage lists a doorway as one location."},{"skill":"Inference","prompt":"Why might artists practise a design many times?","options":["They need to select a different language each time","They want to make every letter larger","To improve control and placement"],"answer":2,"evidence":"The artist often practises the design several times. A beautiful result depends on control, patience, and the careful placement of each letter.","why":"Practice helps artists make deliberate, accurate letters."},{"skill":"Detail","prompt":"What kinds of patterns may appear beside calligraphy?","options":["Geometric or floral patterns","Pictures of buildings and gardens","Number sequences and repeating tiles"],"answer":0,"evidence":"Calligraphy can also appear beside geometric or floral patterns.","why":"These are the two types mentioned."},{"skill":"Main Idea","prompt":"Which statement best expresses the main idea?","options":["Calligraphy explains how buildings are designed","Calligraphy combines writing with artistic design.","Digital writing has replaced traditional artwork"],"answer":1,"evidence":"writing can communicate through both its message and its appearance.","why":"The text explains calligraphy as both meaningful language and art."},{"skill":"Inference","prompt":"Why can a viewer enjoy calligraphy without understanding the words?","options":["The letter shapes can be beautiful themselves.","The pattern uses the same letters each time","The border tells the meaning clearly"],"answer":0,"evidence":"Viewers may appreciate the design even before they understand the written words.","why":"Calligraphy has visual value beyond its literal message."},{"skill":"Detail","prompt":"What do modern learners sometimes use to practise calligraphy?","options":["Pens, paper, or digital tools","Rulers and paper patterns only","Only computer keyboards"],"answer":0,"evidence":"young artists can learn calligraphy using pens, paper, or digital tools.","why":"Modern learners can choose several tools."},{"skill":"Connection","prompt":"A student wants to decorate a poem for display. What should she consider?","options":["The size of the paper, not the letters","Both the words and how the letters look","Only the meaning of the poem"],"answer":1,"evidence":"the shape of every line.","why":"Calligraphy asks the artist to consider the appearance of the writing."}]},{"id":6,"title":"Why Tiles Fit Together","subtitle":"Finding order in repeating shapes","paragraphs":["A repeating tile pattern often looks complicated, but it may begin with only one simple shape. Squares can cover a floor without leaving spaces between them. Some arrangements of triangles and hexagons can do the same. When shapes fit together in a repeated design with no gaps, the arrangement is called a tessellation.","Artists plan tessellations by looking closely at angles and sides. A square has four equal sides and four right angles. A regular hexagon has six equal sides. Different shapes can sometimes be combined to make more interesting designs, but they must meet correctly for the pattern to continue.","In Islamic geometric art, tessellations may decorate tiles on walls or floors. A repeated star shape can appear between other shapes, creating a design that seems to continue beyond the edges. The artist must think about the full surface rather than only one small section.","Students can explore this idea by cutting paper shapes and moving them across a desk. When a gap appears, they can rotate a piece or choose a different arrangement. This simple task helps them understand why careful planning matters in both mathematics and art."],"questions":[{"skill":"Detail","prompt":"What is a tessellation?","options":["A repeated design with spaces between shapes","A repeating design with no gaps","One large shape surrounded by smaller pictures"],"answer":1,"evidence":"When shapes fit together in a repeated design with no gaps, the arrangement is called a tessellation.","why":"The passage defines the word directly."},{"skill":"Detail","prompt":"How many sides does a regular hexagon have?","options":["Six","Eight","Four"],"answer":0,"evidence":"A regular hexagon has six equal sides.","why":"The number is stated in paragraph two."},{"skill":"Inference","prompt":"Why must artists check how different shapes meet?","options":["To make each piece a different colour","To avoid using the same shape twice","To allow the pattern to continue correctly"],"answer":2,"evidence":"they must meet correctly for the pattern to continue.","why":"A repeated design depends on shapes fitting together."},{"skill":"Detail","prompt":"Where can tessellations appear in Islamic geometric art?","options":["On clothing and furniture","Only on book covers","On walls or floors"],"answer":2,"evidence":"tessellations may decorate tiles on walls or floors.","why":"The passage names two surfaces."},{"skill":"Main Idea","prompt":"What is the central idea of the text?","options":["Repeating shapes can connect mathematics and art.","How artists decide which colour to use first","Why every tiled design needs a six-sided shape"],"answer":0,"evidence":"This simple task helps them understand why careful planning matters in both mathematics and art.","why":"The explanation connects shape-fitting to artistic design and mathematical reasoning."},{"skill":"Inference","prompt":"What should students do if paper shapes leave a gap?","options":["Leave the gap as part of the design","Try turning a piece or changing the arrangement","Change the colours without moving pieces"],"answer":1,"evidence":"When a gap appears, they can rotate a piece or choose a different arrangement.","why":"The passage recommends adjusting the shapes."},{"skill":"Detail","prompt":"What can make a design appear to extend beyond its edges?","options":["One star painted in the centre of the wall","A repeated star between other shapes","A different colour on each separate tile"],"answer":1,"evidence":"A repeated star shape can appear between other shapes, creating a design that seems to continue beyond the edges.","why":"Repeating connected shapes creates this effect."},{"skill":"Connection","prompt":"Which classroom activity best demonstrates tessellation?","options":["Cover a paper area with repeated shapes without gaps","Arrange different pictures in a row","Place a few shapes so they almost touch"],"answer":0,"evidence":"Students can explore this idea by cutting paper shapes and moving them across a desk.","why":"Covering a surface with fitting repeated shapes demonstrates tessellation."}]},{"id":7,"title":"Inside a Museum Workshop","subtitle":"Learning from traditional designs","paragraphs":["Museums sometimes offer workshops that help students understand the art they see. In a session about Islamic patterns, a guide may first show photographs of buildings decorated with stars, arches, and repeated lines. Students are asked to notice what remains the same and what changes from one design to another.","Next, the guide gives each group a ruler, coloured pencils, and squared paper. Students begin with a simple shape and repeat it to make a border. Some groups choose squares, while others connect triangles to form larger stars. The activity shows that complex-looking art can grow from a small number of rules.","After the drawing stage, students compare their results. They discuss why some borders look balanced and others look uneven. They also explain how a small mistake early in the sequence can affect the finished pattern. This conversation helps them see the value of careful checking.","Finally, the guide connects the activity to the museum objects. The students now understand that old designs were made through planning, skill, and creativity. They leave with more than a drawing: they have a new way to look at art in their own surroundings."],"questions":[{"skill":"Detail","prompt":"What does the museum guide show first?","options":["Photographs of decorated buildings","Samples of different building materials","Drawings made by the students"],"answer":0,"evidence":"a guide may first show photographs of buildings decorated with stars, arches, and repeated lines.","why":"Images introduce the workshop topic."},{"skill":"Detail","prompt":"Which materials do groups receive?","options":["Paper, paint, and wooden blocks","Rulers, coloured pencils, and squared paper","Only patterned tiles and glue"],"answer":1,"evidence":"the guide gives each group a ruler, coloured pencils, and squared paper.","why":"The materials are listed in paragraph two."},{"skill":"Inference","prompt":"Why might a complicated border begin with simple shapes?","options":["Every large design must have a new rule","Artists use many unrelated shapes at once","Repeated rules can build a larger design."],"answer":2,"evidence":"complex-looking art can grow from a small number of rules.","why":"Simple rules can create rich repeating designs."},{"skill":"Detail","prompt":"What do students compare after drawing?","options":["The way students chose their colours","Why some borders look balanced","Which groups made the biggest stars"],"answer":1,"evidence":"They discuss why some borders look balanced and others look uneven.","why":"The discussion centres on visual balance."},{"skill":"Main Idea","prompt":"What is this passage mainly about?","options":["How to plan a museum exhibition","Why older art should use new materials","How a museum activity teaches students to understand patterns"],"answer":2,"evidence":"They leave with more than a drawing: they have a new way to look at art in their own surroundings.","why":"The museum workshop develops students’ understanding of geometric designs."},{"skill":"Inference","prompt":"What may happen if a student makes a mistake at the beginning of a pattern?","options":["The later parts may also be affected.","Students must restart every later section","The earliest colours may become lighter"],"answer":0,"evidence":"a small mistake early in the sequence can affect the finished pattern.","why":"Repeated patterns build on earlier steps."},{"skill":"Detail","prompt":"What do some groups connect to make bigger stars?","options":["Hexagons","Triangles","Squares"],"answer":1,"evidence":"others connect triangles to form larger stars.","why":"The workshop uses triangles to build stars."},{"skill":"Connection","prompt":"How could students use what they learned after leaving the museum?","options":["Look for repeated designs in nearby buildings","Make drawings without checking repeated shapes","Focus only on the dates of the objects"],"answer":0,"evidence":"they have a new way to look at art in their own surroundings.","why":"Students can apply the skill by noticing patterns around them."}]},{"id":8,"title":"Patterns in Many Materials","subtitle":"How craftspeople choose their tools","paragraphs":["A single geometric design can look different depending on the material used to make it. The same eight-pointed star might appear on a wooden door, a carpet, or a ceramic tile. Although the shape stays the same, the texture, colour, and method of making it can change the final result.","Woodworkers may cut or carve lines into a door. A deep carving creates shadows that help the design stand out. Weavers make patterns by arranging threads in different colours. They must count their steps carefully, because the order of the threads controls the repeated shapes.","Ceramic artists often decorate tiles before the surface is finished. They can repeat a small design across many tiles to cover a large wall. However, they need to check that the shapes meet at each edge. Otherwise, the completed wall may look like separate pictures rather than one connected pattern.","These different techniques require skill and planning. A craftsperson chooses tools according to the material and the effect they want. Studying the same shape in wood, fabric, and tile helps visitors see how creativity can work with many different surfaces."],"questions":[{"skill":"Detail","prompt":"Where might the same eight-pointed star appear?","options":["On carved stone, curtains, and glass","On a metal gate, floor, and window","On a wooden door, carpet, or tile"],"answer":2,"evidence":"The same eight-pointed star might appear on a wooden door, a carpet, or a ceramic tile.","why":"The passage gives three examples."},{"skill":"Detail","prompt":"What makes a carved wooden design stand out?","options":["Bright colours painted on the wood","Shadows from deep lines","Small tiles attached to the door"],"answer":1,"evidence":"A deep carving creates shadows that help the design stand out.","why":"Depth causes the shadow effect."},{"skill":"Inference","prompt":"Why do weavers need to count their steps?","options":["The order of threads determines the pattern.","The threads create different textures","Counting helps every piece become wider"],"answer":0,"evidence":"They must count their steps carefully, because the order of the threads controls the repeated shapes.","why":"Changing thread order can change the pattern."},{"skill":"Detail","prompt":"What must tile artists check at each edge?","options":["That shapes meet correctly","That the tiles are cut from the same material","That the colours are equally bright"],"answer":0,"evidence":"they need to check that the shapes meet at each edge.","why":"Matching edges connects the design across tiles."},{"skill":"Main Idea","prompt":"What does the passage mainly show?","options":["Pattern making depends only on colour","A design can be created in different materials using different methods.","The same tools are used on all surfaces"],"answer":1,"evidence":"A single geometric design can look different depending on the material used to make it.","why":"The passage compares materials and techniques."},{"skill":"Inference","prompt":"Why might an artist choose carving rather than weaving?","options":["The artist wants flat coloured fabric","The artist wants a textured wooden effect.","The artist wants a smooth glazed tile"],"answer":1,"evidence":"Woodworkers may cut or carve lines into a door. A deep carving creates shadows that help the design stand out.","why":"Carving creates depth and shadow in wood."},{"skill":"Detail","prompt":"What can ceramic artists do to cover a large wall?","options":["Choose a different design for every tile","Use one star painted on each wall","Repeat a design on many tiles"],"answer":2,"evidence":"They can repeat a small design across many tiles to cover a large wall.","why":"Repeating tiles expands the pattern."},{"skill":"Connection","prompt":"A student wants to make a pattern in fabric. Which technique matches the passage?","options":["Arrange coloured threads in a careful order","Place printed pictures over the fabric","Paint coloured shapes on a ceramic surface"],"answer":0,"evidence":"Weavers make patterns by arranging threads in different colours.","why":"Weaving uses the order and colour of threads."}]},{"id":9,"title":"The Balance of Symmetry","subtitle":"Looking at matching sides","paragraphs":["Symmetry is one reason many geometric patterns look balanced. A simple design may have two sides that match like reflections in a mirror. If a line is drawn through its centre, the shapes on the left can match those on the right. This type of balance is easy to notice in stars and some tiled borders.","Not every pattern uses the same kind of balance. Some designs repeat shapes as they turn around a centre. Others repeat along a long border. Artists choose the arrangement that works best for the space they want to decorate. A narrow doorway may need a different design from a wide wall.","To check symmetry, students can fold a paper drawing in half. If the important lines meet, the two halves match. For more detailed patterns, artists may use rulers and measurements. This is useful because small differences become easier to see when shapes are repeated many times.","Symmetry is common in art, but it also appears in nature. Many leaves and butterflies have parts that look similar on both sides. By comparing natural shapes with decorative patterns, learners can understand how artists find ideas in the world around them."],"questions":[{"skill":"Detail","prompt":"What happens when a symmetrical design is divided through its centre?","options":["The centre forms a new shape each time","The two sides can match","Each side has a different arrangement"],"answer":1,"evidence":"the shapes on the left can match those on the right.","why":"Matching sides describe one kind of symmetry."},{"skill":"Detail","prompt":"Where can shapes repeat while turning around a centre?","options":["In designs reflected across a central line","Only in patterns without a centre","In some designs with rotational balance"],"answer":2,"evidence":"Some designs repeat shapes as they turn around a centre.","why":"The passage describes repeating shapes around a point."},{"skill":"Inference","prompt":"Why might a doorway need a different pattern from a wall?","options":["Doorways need softer materials than walls","The available spaces have different shapes and sizes.","Different colours are required on each surface"],"answer":1,"evidence":"A narrow doorway may need a different design from a wide wall.","why":"The artist adapts the pattern to the space."},{"skill":"Detail","prompt":"How can students check whether two halves match?","options":["Fold a paper drawing in half","Compare the number of colours","Check if each shape has six sides"],"answer":0,"evidence":"students can fold a paper drawing in half.","why":"Folding can reveal matching halves."},{"skill":"Main Idea","prompt":"What is the main purpose of this passage?","options":["Why patterns must contain equal numbers","To explain symmetry in art and nature","How flowers are grown in gardens"],"answer":1,"evidence":"Symmetry is common in art, but it also appears in nature.","why":"The text explains kinds of balance and how to recognise them."},{"skill":"Inference","prompt":"Why are measurements helpful in detailed patterns?","options":["Small differences are easier to notice and correct.","They are needed to select brighter colours","They make repeating shapes look different"],"answer":0,"evidence":"small differences become easier to see when shapes are repeated many times.","why":"Precision matters especially for repeated shapes."},{"skill":"Detail","prompt":"Which natural examples are mentioned?","options":["Leaves and butterflies","Shells and pebbles","Trees and flowers"],"answer":0,"evidence":"Many leaves and butterflies have parts that look similar on both sides.","why":"Those two examples are named."},{"skill":"Connection","prompt":"A student wants matching halves on a poster. What should she use?","options":["A different pattern on each half","Colours arranged without checking the middle","A centre line and careful measurements"],"answer":2,"evidence":"If a line is drawn through its centre, the shapes on the left can match those on the right.","why":"A centre line helps create mirror-like balance."}]},{"id":10,"title":"Old Designs, New Technology","subtitle":"Protecting patterns for the future","paragraphs":["Historic buildings contain patterns that tell us about the skills of artists from the past. Over time, however, sunlight, wind, and rain may damage painted walls or decorated tiles. Small parts of a design can fade or break, making the original pattern difficult to recognise. This creates a challenge for people who care for old buildings.","Today, specialists can photograph damaged designs and study them on computers. Digital images allow them to enlarge tiny details without touching the original surface. They can also compare repeated sections of a pattern. If one section is missing, another section may offer useful clues about its shape.","Technology does not always provide a perfect answer. A photograph may show the colours of a tile, but it cannot explain every decision made by the original artist. For this reason, specialists combine digital tools with historical research and knowledge of traditional crafts.","Protecting patterns is about more than making a building look new. These designs are part of cultural history and can teach future visitors about art, mathematics, and careful workmanship. New tools help people study them, while respect for older skills helps preserve their meaning."],"questions":[{"skill":"Detail","prompt":"What may damage historic patterns over time?","options":["Sunlight, dust, and repeated cleaning","Wind, heat, and regular repairs","Sunlight, wind, and rain"],"answer":2,"evidence":"sunlight, wind, and rain may damage painted walls or decorated tiles.","why":"Weather can cause fading and damage."},{"skill":"Detail","prompt":"Why do specialists enlarge digital images?","options":["To examine tiny details","To replace the original artwork","To compare modern and historic building sizes"],"answer":0,"evidence":"Digital images allow them to enlarge tiny details without touching the original surface.","why":"Enlargement helps careful study without contact."},{"skill":"Inference","prompt":"How could another repeated section help if one part is missing?","options":["It can show the age of the wooden tools","It may show what the lost shape looked like.","It can identify the building’s original owner"],"answer":1,"evidence":"If one section is missing, another section may offer useful clues about its shape.","why":"Repeated parts can help reconstruct missing details."},{"skill":"Detail","prompt":"What knowledge do specialists combine with digital tools?","options":["The most recently purchased materials","Historical research and traditional crafts","Only photographs of new buildings"],"answer":1,"evidence":"specialists combine digital tools with historical research and knowledge of traditional crafts.","why":"The passage names both kinds of knowledge."},{"skill":"Main Idea","prompt":"What is this passage mainly about?","options":["Why new designs are more useful than old ones","How technology and traditional knowledge help protect historic patterns","How to replace traditional crafts with computers"],"answer":1,"evidence":"New tools help people study them, while respect for older skills helps preserve their meaning.","why":"The text explains preservation through modern and traditional methods."},{"skill":"Inference","prompt":"Why might a photograph not answer every restoration question?","options":["It cannot show every choice the original artist made.","Every photo shows colours differently","A photograph cannot record the date of a repair"],"answer":0,"evidence":"A photograph may show the colours of a tile, but it cannot explain every decision made by the original artist.","why":"Images provide visual evidence but not every part of the original process."},{"skill":"Detail","prompt":"What may happen to small parts of an old pattern?","options":["They may fade or break","They may form new shapes","They may become brighter"],"answer":0,"evidence":"Small parts of a design can fade or break","why":"Damage can hide parts of the design."},{"skill":"Connection","prompt":"A museum finds a damaged repeated design. What should its team do?","options":["Use a new pattern that looks similar","Replace the missing area without looking at other parts","Study photos and compare other repeated sections"],"answer":2,"evidence":"They can also compare repeated sections of a pattern.","why":"Comparing surviving sections is a sensible restoration step."}]}];
const KEY="g7_patterns_reading_practice_v2";
const app=document.getElementById('app');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let history={};try{history=JSON.parse(localStorage.getItem(KEY)||'{}')||{}}catch(e){history={}}
let current=null,answers=[],submitted=false,evidenceIndex=null,timed=false,seconds=15*60,timer=null;
const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(history))}catch(e){}};
const label=n=>String(n).padStart(2,'0');
const countAnswers=()=>answers.filter(a=>a!==null).length;
const getWordCount=p=>p.paragraphs.join(' ').trim().split(/\s+/).length;
const layout=(main)=>`<header class="topbar"><div class="wrap bar"><button class="brand" data-action="home" aria-label="Go to reading practice home"><span class="brand-symbol">✳</span><span>READING LAB<small>Grade 7 · End-of-Term 1</small></span></button><button class="nav-btn" data-action="home">All 10 Practices</button></div></header><main class="wrap">${main}</main><footer class="wrap site-footer"><span>Grade 7 General · Cycle 2 · Part 3B: Patterns · B1.1</span><span>Independent practice based on the 2026–2027 test specification. Not an official Ministry exam.</span></footer>`;
function renderHome(){stopTimer();current=null;let done=Object.values(history).filter(r=>r?.attempts>0).length;let scoreSum=Object.values(history).reduce((a,r)=>a+(r?.best||0),0);let cards=PRACTICES.map((p,i)=>{let r=history[p.id];return `<article class="practice-card"><div class="card-top"><span class="num">${label(p.id)}</span><div><h3 class="topic">${esc(p.title)}</h3><div class="meta">${esc(p.subtitle)}</div></div></div><div class="meta">${getWordCount(p)} words · 8 questions · 16 marks · 3 choices each</div><div class="card-bottom"><span class="chip ${r?'gold':'untried'}">${r?`Best: ${r.best}/16 · ${r.attempts} attempt${r.attempts===1?'':'s'}`:'Not started yet'}</span><button class="start" data-action="open" data-idx="${i}">${r?'Practise again':'Start practice'}</button></div></article>`}).join('');
app.innerHTML=layout(`<section class="hero"><div class="eyebrow">UAE English · Grade 7 General · 2026–2027</div><h1>Read. Think. Prove it.</h1><p>10 realistic reading practices about Patterns and Islamic Art. Answer like a final exam, then discover the exact evidence in each passage.</p><div class="stats"><span class="stat">10 original passages</span><span class="stat">80 exam-style questions</span><span class="stat">8 questions × 2 marks</span><span class="stat">Evidence after submission</span></div></section><div class="main-title"><div><h2>Choose your reading practice</h2><p class="subtext">Progress is saved on this device. Finish any practice in any order.</p></div><div class="chip">${done}/10 completed · ${done?`Best marks total ${scoreSum}/160`:'Ready to begin'}</div></div><div class="cardgrid">${cards}</div><aside class="hint"><strong>Exam format:</strong> Each passage has four detail questions, two inference questions, one connection question and one overall-meaning question. Choose A, B or C. The answers and paragraph evidence appear only after you submit. The optional 15-minute timer is a study tool, not an official exam time. <button class="outline" style="margin-left:10px" data-action="reset-progress">Reset my progress</button></aside>`);
window.scrollTo({top:0,behavior:'instant'});
}
function startPractice(index){stopTimer();current=index;answers=Array(8).fill(null);submitted=false;evidenceIndex=null;timed=false;seconds=900;renderPractice();window.scrollTo({top:0,behavior:'instant'})}
function passageHtml(p){return p.paragraphs.map((text,i)=>{let highlighted=text;if(submitted&&evidenceIndex!==null){let q=p.questions[evidenceIndex];let pos=text.indexOf(q.evidence);if(pos>=0)highlighted=esc(text.slice(0,pos))+'<mark id="evidence-hit">'+esc(q.evidence)+'</mark>'+esc(text.slice(pos+q.evidence.length));else highlighted=esc(text)}else highlighted=esc(text);return `<p id="p${i+1}"><span class="para-num" aria-label="Paragraph ${i+1}">${i+1}</span>${highlighted}</p>`}).join('')}
function optsHtml(q,qi){return q.options.map((choice,j)=>{let selected=answers[qi]===j;let right=submitted&&j===q.answer;let wrong=submitted&&selected&&j!==q.answer;let state=right?'correct':wrong?'wrong':'';return `<label class="option ${state} ${submitted?'review-only':''}"><input type="radio" name="q${qi}" value="${j}" data-question="${qi}" ${selected?'checked':''} ${submitted?'disabled':''} /><span class="option-text"><span class="option-letter">${'ABC'[j]}.</span> ${esc(choice)}</span></label>`}).join('')}
function reviewHtml(q,qi){let right=answers[qi]===q.answer;let paragraph=PRACTICES[current].paragraphs.findIndex(t=>t.includes(q.evidence))+1;return `<div class="answer-review ${right?'':'incorrect'}"><div class="review-tag">${right?'✓ Correct':'✕ Not correct'} · ${esc(q.skill)} · Evidence in paragraph ${paragraph}</div><div><strong>Correct answer: ${'ABC'[q.answer]}.</strong> ${esc(q.options[q.answer])}</div><div class="evidence-quote">“${esc(q.evidence)}”</div><div><strong>Why:</strong> ${esc(q.why)}</div><button class="evidence-btn" data-action="evidence" data-q="${qi}">↗ Highlight this evidence in the text</button></div>`}
function resultHTML(){if(!submitted)return '';const points=answers.reduce((s,a,i)=>s+(a===PRACTICES[current].questions[i].answer?2:0),0);return `<section class="score-banner" aria-live="polite"><div><h2>${points===16?'Excellent reading!':points>=12?'Good progress!':'Keep practising—check the evidence.'}</h2><p>${points/2} correct out of 8 · Review every question below and find the evidence in the passage.</p></div><div class="bigscore">${points}<span style="font-size:1.05rem;font-weight:700">/16</span></div><div class="score-actions"><button class="secondary" data-action="retry">Try again</button><button class="primary" data-action="next">${current===9?'Back to all':'Next practice →'}</button></div></section>`}
function renderPractice(){let p=PRACTICES[current];let allAnswered=countAnswers();app.innerHTML=layout(`<div class="exam-head"><button class="crumb" data-action="home">← Back to all reading practices</button><div class="print-heading">GRADE 7 ENGLISH • END-OF-TERM 1 READING PRACTICE • Student name: ____________________ Date: __________</div><h1 class="exam-title">Practice ${label(p.id)}: ${esc(p.title)}</h1><p class="subtext">${esc(p.subtitle)} · ${getWordCount(p)} words · Informational text (B1.1) · 8 questions × 2 marks = 16 marks</p><div class="exam-toolbar"><span class="tool-chip mint" id="answer-progress">${submitted?'Submitted':`${allAnswered}/8 answered`}</span><span class="tool-chip">Part 3B · Patterns / Islamic Art</span><button class="outline" data-action="print">Print this practice</button><button class="outline ${timed?'timer-on':''}" data-action="timer" id="timerbutton" ${submitted?'disabled':''}>${timed?'⏱ '+timeText()+' · Timer on':'⏱ Start optional 15-min timer'}</button></div>${submitted?'':`<div class="progress-track"><div id="progress-fill" class="progress-fill" style="width:${100*allAnswered/8}%"></div></div>`}</div>${resultHTML()}<div class="exam-layout"><section class="reading-panel" aria-labelledby="reading-title"><div class="panel-header"><h2 id="reading-title">Reading Passage</h2><span>${getWordCount(p)} WORDS</span></div><div class="reading-body" id="passage-body">${passageHtml(p)}</div></section><section class="questions-panel" aria-labelledby="questions-title"><div class="panel-header"><h2 id="questions-title">Choose the correct answer: A, B or C</h2><span>16 MARKS</span></div><div class="questions-list">${p.questions.map((q,i)=>`<section class="q-block" id="question${i+1}"><div class="q-head"><span class="q-number">${i+1}</span><strong>${esc(q.prompt)}</strong></div><div class="choices">${optsHtml(q,i)}</div>${submitted?reviewHtml(q,i):''}</section>`).join('')}</div><div class="submit-area">${submitted?`<span class="muted">All answers, explanations and evidence are shown above.</span><button class="primary" data-action="next">${current===9?'Finish':'Next practice →'}</button>`:`<span class="muted">Answer all 8 questions. You may change answers before submitting.</span><button class="primary" data-action="submit">Submit answers</button>`}</div></section></div>${submitted?'<p class="notice">Evidence is taken directly from each passage. Click “Highlight this evidence” under an answer to locate the exact words in the text.</p>':''}`)}
function timeText(){return Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0')}
function stopTimer(){if(timer)clearInterval(timer);timer=null}
function toggleTimer(){if(current===null||submitted)return;if(timed){timed=false;stopTimer()}else{timed=true;timer=setInterval(()=>{seconds--;let b=document.getElementById('timerbutton');if(b)b.textContent='⏱ '+timeText()+' · Timer on';if(seconds<=0){stopTimer();timed=false;alert('Your optional 15-minute timer ended. Your answers will now be marked.');submitAnswers(true)}},1000)}let b=document.getElementById('timerbutton');if(b){b.textContent=timed?'⏱ '+timeText()+' · Timer on':'⏱ Start optional 15-min timer';b.classList.toggle('timer-on',timed)}}
function submitAnswers(force=false){if(current===null||submitted)return;let missing=8-countAnswers();if(missing&&!force&&!confirm(`You have ${missing} unanswered question${missing>1?'s':''}. Submit anyway?`))return;stopTimer();timed=false;submitted=true;evidenceIndex=null;let p=PRACTICES[current];let mark=answers.reduce((s,a,i)=>s+(a===p.questions[i].answer?2:0),0);let r=history[p.id]||{best:0,latest:0,attempts:0};history[p.id]={best:Math.max(mark,r.best),latest:mark,attempts:r.attempts+1};persist();renderPractice();window.scrollTo({top:0,behavior:'smooth'})}
function highlightEvidence(qi){if(!submitted)return;evidenceIndex=qi;let p=PRACTICES[current];let e=document.getElementById('passage-body');e.innerHTML=passageHtml(p);let hit=document.getElementById('evidence-hit');if(hit){hit.scrollIntoView({behavior:'smooth',block:'center'});hit.setAttribute('tabindex','-1');hit.focus({preventScroll:true})}}
app.addEventListener('change',event=>{let target=event.target;if(!target.matches('input[data-question]')||submitted)return;let i=Number(target.dataset.question);answers[i]=Number(target.value);const answered=countAnswers();let el=document.getElementById('answer-progress');if(el)el.textContent=`${answered}/8 answered`;let bar=document.getElementById('progress-fill');if(bar)bar.style.width=`${answered*100/8}%`});
app.addEventListener('click',event=>{let target=event.target.closest('[data-action]');if(!target)return;switch(target.dataset.action){case 'home':renderHome();break;case 'open':startPractice(Number(target.dataset.idx));break;case 'submit':submitAnswers();break;case 'retry':startPractice(current);break;case 'next':current===PRACTICES.length-1?renderHome():startPractice(current+1);break;case 'evidence':highlightEvidence(Number(target.dataset.q));break;case 'timer':toggleTimer();break;case 'print':window.print();break;case 'reset-progress':if(confirm('Remove saved scores for all 10 reading practices on this device?')){history={};persist();renderHome()}break;}});
renderHome();
</script></body></html>
