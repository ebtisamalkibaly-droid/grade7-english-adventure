gin-bottom:15px;border-radius:15px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}.completion h3{margin:0;color:#087367;font-size:1rem}.completion p{margin:3px 0 0;font-size:.83rem;color:#3d7770}.completion .solid{font-size:.82rem}.legend{background:white;border:1px solid var(--line);border-radius:13px;padding:12px 16px;margin:15px 0;font-size:.82rem;color:var(--sub)}.legend b{color:var(--ink)}.print-title{display:none}body.dark{--ink:#e7eef4;--sub:#a7b8c7;--muted:#223b50;--light:#101f2e;--white:#172b3b;--navy:#e2f1fa;--line:#344b5c;--teal:#51cbb7;--teal-light:#123d3c;--red-light:#4a2530;--amber-light:#3d301c;--shadow:0 10px 30px rgba(0,0,0,.12)}body.dark .topbar,body.dark .pane-head,body.dark .question,body.dark .choice,body.dark .outline,body.dark .ghost,body.dark .chip,body.dark .round,body.dark .stat,body.dark .guide,body.dark .legend{background:var(--white)}body.dark .brand{color:var(--ink)}body.dark .logo{background:#265872}body.dark .hero{background:linear-gradient(110deg,#11465c,#136a6a)}body.dark .story{color:#e4edf3}body.dark .answered{background:#183b36}body.dark .failed{background:#3a2731}body.dark .choice .letter{background:#314b5d;color:#e6f0f5}body.dark .pill{background:#2b4560;color:#d5eafd}body.dark .pill.green{background:#1d4a45;color:#80efcf}body.dark .pill.gold{background:#584325;color:#ffdb86}body.dark .pill.violet{background:#42365a;color:#e0d0ff}body.dark .pill.rose{background:#532d38;color:#ffb4c0}body.dark .chip.active{background:#266e76;color:white}body.dark .solid{background:#157c73;color:white}body.dark .response.warn{background:#42331f;color:#ffe3ac;border-color:#725632}body.dark .response.success{background:#1a493b;color:#b8efd7;border-color:#397b61}body.dark .response.error{background:#4c2932;color:#ffbdc7;border-color:#7b4350}body.dark .choice.selected-right,body.dark .choice.reveal-right{background:#15443a}body.dark .choice.selected-wrong{background:#4c2934}body.dark .completion{background:#173d <script>
'use strict';
const PASSAGES=[{"id":1,"level":"easy","cefr":"B1+","part":"3A","theme":"Money Talks","title":"A Savings Plan That Worked","body":"When Lina began her final year of school, she wanted to buy a laptop for university. The laptop cost more than she could afford, and she did not want to ask her family to pay for everything. Her older sister suggested a simple idea: save a small amount of money every week rather than wait for one large payment.\n\nLina first wrote down her income and expenses. She received a small monthly allowance and earned extra money by helping younger children with reading. She discovered that buying snacks after school used more of her money than she expected. Instead of stopping all her spending, she chose two days a week when she would bring food from home. She put the money she saved into a separate account. She wrote her goal on a small card and checked her progress every Friday. Her friends sometimes invited her to expensive cafés, but Lina explained that she was saving for something important. They soon began looking for cheaper activities together.\n\nAfter two months, Lina had saved enough to pay for almost half the laptop. However, an unexpected problem appeared. Her bicycle needed repairs. She was disappointed because she had planned to use all her savings for the computer. Her teacher explained that saving also means preparing for emergencies. Lina decided to keep a small emergency fund and continue saving for the laptop more slowly.\n\nAt the end of the school year, Lina bought the laptop using her own savings and a small contribution from her parents. She felt proud, but her biggest achievement was not the computer itself. She had learned to make a realistic plan, distinguish between needs and wants, and adjust her goals when circumstances changed. She now encourages her classmates to begin with small, regular savings, even if their income is limited.","questions":[{"skill":"Specific information","question":"Why did Lina want to save money?","options":["To repair her bicycle","To buy a laptop for university","To pay for reading lessons"],"answer":1,"hint":"Look at Lina’s goal in the first paragraph.","explanation":"The first paragraph states that Lina wanted a laptop for university.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Specific information","question":"How did Lina earn extra money?","options":["By teaching university courses","By selling second-hand laptops","By helping younger children with reading"],"answer":2,"hint":"Find the sentence about her income.","explanation":"Lina earned extra money by helping younger children with reading.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"Which expense surprised Lina?","options":["School snacks","Bicycle insurance","University fees"],"answer":0,"hint":"Check the list of expenses in paragraph two.","explanation":"She discovered that snacks after school cost more than expected.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What did Lina do to reduce her spending?","options":["She stopped buying anything","She brought food from home twice a week","She asked her sister for a bigger allowance"],"answer":1,"hint":"Find her practical change in paragraph two.","explanation":"She chose two days a week to bring food from home, rather than cutting out all spending.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"Why did Lina change her savings plan?","options":["Her laptop became cheaper","She lost her part-time work","Her bicycle needed repairs"],"answer":2,"hint":"Read what happened after two months.","explanation":"An unexpected bicycle repair made Lina keep an emergency fund and save more slowly.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Main point","question":"What is the main lesson of Lina’s experience?","options":["Saving requires planning and flexibility","All borrowing is dangerous","Only people with high incomes can save"],"answer":0,"hint":"Think about what Lina learned, not only what she bought.","explanation":"The text highlights planning, separating needs from wants, and adapting to unexpected expenses.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"What can we infer about Lina’s attitude at the end?","options":["She thinks small savings are pointless","She values the habits she developed","She regrets buying the laptop"],"answer":1,"hint":"Look at what she considers her biggest achievement.","explanation":"She says the biggest achievement was not the laptop but learning to manage money.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Overall meaning","question":"Which title best expresses the message of the text?","options":["The Most Expensive Computer","Why Students Should Never Spend","Small Steps Towards Financial Independence"],"answer":2,"hint":"Choose a title that covers the whole story.","explanation":"The passage shows how steady, practical saving can build financial independence.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]}],"wordCount":302},{"id":2,"level":"easy","cefr":"B1+","part":"3A","theme":"Nail That Job!","title":"The First Week of an Internship","body":"Omar was nervous on the first morning of his internship at a local design company. He had never worked in an office, and he worried that he would make mistakes. His supervisor, Ms. Huda, welcomed him and explained that an internship is a chance to learn, not a test of everything a student already knows.\n\nDuring the first week, Omar helped organise digital files, prepare a short presentation and take notes during meetings. Some tasks were easy, while others required new skills. When he did not understand an instruction, he used to stay silent. One afternoon, he saved a document in the wrong folder, which made his team spend extra time searching for it. He felt embarrassed, but Ms. Huda told him that asking a clear question early is better than correcting a problem later.\n\nFrom that day, Omar carried a notebook. Before starting a task, he checked the deadline and repeated the main instructions to make sure he understood. He also watched how experienced workers communicated with each other. He noticed that they disagreed politely, shared responsibilities and thanked people for their help. These habits made the workplace more comfortable and productive. Omar also learned that feedback was not a personal criticism. When a colleague suggested changes to his slides, he listened, asked for an example and improved the presentation. The result was clearer for everyone.\n\nAt the end of the internship, Omar expected his supervisor to focus on his technical ability. Instead, she praised his willingness to improve, punctuality and communication. She explained that employers often look for adaptability as well as experience. Omar realised that career preparation begins long before a person gets a full-time job. When he returned to school, he encouraged his friends to volunteer, join projects and practise explaining their ideas clearly. He was still learning, but he no longer believed that beginners had to be perfect.","questions":[{"skill":"Specific information","question":"Where did Omar complete his internship?","options":["At a design company","At a hospital","At a university"],"answer":0,"hint":"Find the workplace in the opening sentence.","explanation":"Omar began an internship at a local design company.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Specific information","question":"Who guided Omar during the internship?","options":["His classmate","His supervisor, Ms. Huda","A visiting customer"],"answer":1,"hint":"Look for the person who welcomed him.","explanation":"His supervisor was Ms. Huda.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What mistake did Omar make?","options":["He arrived late every day","He forgot to attend a meeting","He saved a file in the wrong folder"],"answer":2,"hint":"Read the incident in paragraph two.","explanation":"The text explains that he saved a document in the wrong folder.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"How did Omar check that he understood a task?","options":["By repeating the main instructions","By waiting until the deadline","By asking another intern to do it"],"answer":0,"hint":"Read his new routine after the mistake.","explanation":"He checked deadlines and repeated instructions before working.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What behaviour did Omar notice among experienced workers?","options":["They avoided sharing tasks","They disagreed politely and thanked colleagues","They never asked questions"],"answer":1,"hint":"Find the examples of communication in paragraph three.","explanation":"Experienced workers disagreed politely, shared responsibilities and expressed thanks.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Main point","question":"What is the text mainly about?","options":["Why internships should be unpaid","How to become a professional designer","How an internship develops useful work habits"],"answer":2,"hint":"Think about how Omar changes from beginning to end.","explanation":"The focus is on learning, communication, adaptability and growth during an internship.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"What does Ms. Huda probably value in new employees?","options":["The ability to learn from mistakes","Knowing every skill before starting","Working alone without feedback"],"answer":0,"hint":"Consider what she praises at the end.","explanation":"She praises willingness to improve, punctuality and communication, not perfection.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Overall meaning","question":"Which statement best matches the author’s message?","options":["Technical skills are the only path to success","Good work habits can be learned through practice","Students should avoid internships until university"],"answer":1,"hint":"Choose the statement supported by Omar’s full experience.","explanation":"Omar gains skills by practising and accepting feedback throughout his internship.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]}],"wordCount":313},{"id":3,"level":"medium","cefr":"B2.1","part":"3A","theme":"Money Talks | Consumerism and the Human Brain","title":"Why Discounts Feel Like Opportunities","body":"A bright sign in a shop announces that a jacket is half price for one day only. A customer who did not plan to buy clothes suddenly feels that leaving without the jacket would mean losing something valuable. This reaction shows that buying decisions are not always based on practical needs. Our brains also respond to urgency, emotions and the way information is presented.\n\nOne common marketing technique is to display an original price next to a lower sale price. The first number becomes a reference point, making the second appear especially attractive. Yet a discount does not automatically represent good value. If a customer never needed the jacket, spending less than the original price still means spending money unnecessarily. Retailers may also use countdown clocks or messages such as \"Only three left\" to create a sense of scarcity. These messages can encourage rapid decisions before people compare alternatives.\n\nSocial influence adds another layer. When an advertisement shows a popular influencer wearing a product, viewers may associate it with belonging or success. This does not mean that every advertisement is dishonest. Marketing can help people discover useful products and compare features. The problem arises when emotional excitement replaces consideration of cost, quality and personal priorities.\n\nConsumer researchers often suggest a simple pause before non-essential purchases. Shoppers can ask whether they would want the item without the sale sign, whether it fits their budget and whether they already own something similar. Some people find that waiting a day reduces the feeling of urgency. Others maintain a list of intended purchases and compare offers only for items on that list. These strategies do not remove emotion from shopping; they create enough distance for thoughtful decisions. Understanding the techniques behind a promotion is therefore an important part of financial literacy, especially for young consumers facing constant online advertising.","questions":[{"skill":"Specific information","question":"What does the original price provide in a discount advertisement?","options":["A guarantee of quality","A reference point for judging the sale price","Proof that the item is necessary"],"answer":1,"hint":"Read how the two prices work together.","explanation":"The original price acts as a reference point, making the discount seem more attractive.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Specific information","question":"What is the purpose of a message such as \"Only three left\"?","options":["To create urgency","To explain product materials","To offer customer support"],"answer":0,"hint":"Look at the explanation of scarcity.","explanation":"The passage says scarcity messages encourage quick decisions.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"Why might a discounted jacket still be a poor purchase?","options":["The shop must be dishonest","Discounted clothes are always low quality","The buyer may not need it"],"answer":2,"hint":"Separate lower price from personal need.","explanation":"A lower price does not make an unnecessary purchase useful.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What can an influencer create in viewers?","options":["An automatic refund","An association with belonging or success","A precise comparison of product quality"],"answer":1,"hint":"Find what the text says about social influence.","explanation":"Viewers may associate the advertised product with belonging or success.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"Which strategy does the author recommend?","options":["Waiting before buying a non-essential item","Buying every item with a large discount","Choosing products only because influencers recommend them"],"answer":0,"hint":"Look for the advice in the final paragraph.","explanation":"The text recommends pausing or waiting a day before non-essential purchases.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Main point","question":"What is the central point of the passage?","options":["Advertising has no benefits for customers","All shopping choices are fully logical","Recognising marketing techniques helps consumers choose wisely"],"answer":2,"hint":"Choose the idea that links each paragraph.","explanation":"The writer explains emotional marketing effects and strategies for more thoughtful buying.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"A shopper who waits a day after seeing a countdown offer is probably trying to...","options":["Make the item more expensive","Reduce pressure from the feeling of urgency","Help the shop sell its remaining stock"],"answer":1,"hint":"Connect the suggested pause to the purpose of countdown clocks.","explanation":"Waiting creates distance from urgency and supports careful decisions.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Overall meaning","question":"Which statement best describes the author’s view of advertising?","options":["It can be informative but should be evaluated critically","It always tricks consumers","It has no effect on buying behaviour"],"answer":0,"hint":"Notice the contrast between benefits and risks.","explanation":"The author recognises that advertising can inform people while warning about emotional pressure.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]}],"wordCount":305},{"id":4,"level":"medium","cefr":"B2.1","part":"3A","theme":"Money Talks | Does Money Talk?","title":"The Real Cost of Student Borrowing","body":"When Mariam received an offer to study engineering, she was excited about the opportunity but worried about the fees. Her family could contribute some money, yet the remaining amount was significant. A student loan seemed to offer an immediate solution. Before making a decision, Mariam attended a financial advice session at her school.\n\nThe adviser explained that loans are not simply extra income. Borrowed money must be repaid, often with interest, and the total cost depends on the repayment period. A longer period may reduce the amount due each month, but it can increase the overall amount paid. Mariam learned to compare different offers rather than choosing the one with the smallest monthly payment. She also examined how repayments might affect her future budget when she began working. To make the numbers easier to understand, she prepared a simple table showing possible monthly payments and the remaining money for rent, transport and food.\n\nThe adviser encouraged students to consider other sources of support. Scholarships could reduce tuition costs without creating debt, although they were competitive and required careful applications. Part-time work was another possibility, but it could limit the hours available for studying. Mariam decided to apply for two scholarships and to put aside some of the money she earned from weekend tutoring. She also chose a less expensive transport option rather than buying a car.\n\nEventually, Mariam obtained a partial scholarship and borrowed a smaller amount than she had first expected. She understood that accepting a loan was neither automatically irresponsible nor automatically wise. Its value depended on the purpose, the terms and her ability to repay it. More importantly, she realised that financial decisions often involve trade-offs: a solution that helps in the present can create responsibilities in the future. Her careful preparation did not remove uncertainty, but it allowed her to approach university with a clearer plan and greater confidence.","questions":[{"skill":"Specific information","question":"Why was Mariam considering a student loan?","options":["To cover remaining university fees","To pay for a holiday","To open a design company"],"answer":0,"hint":"Read the first paragraph about her university offer.","explanation":"Her family could pay part of the fees, but she needed support for the remainder.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Specific information","question":"What may happen with a longer repayment period?","options":["The loan always becomes free","The overall amount paid can increase","The interest automatically disappears"],"answer":1,"hint":"Find the contrast between monthly and total payments.","explanation":"Longer repayment can lower monthly payments while increasing the total paid.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What did the adviser encourage students to compare?","options":["Only the smallest monthly payment","Only the name of the lender","The terms and total costs of different offers"],"answer":2,"hint":"Think beyond a single monthly figure.","explanation":"The adviser wanted students to compare offers, interest and repayment consequences.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What is one disadvantage of part-time work for students?","options":["It can reduce study time","It prevents scholarship applications","It increases tuition fees"],"answer":0,"hint":"Find the trade-off connected to part-time work.","explanation":"The text says part-time work could limit time available for studying.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"Which steps helped Mariam borrow less?","options":["Buying a car before university","Gaining a partial scholarship and saving tutoring income","Rejecting every source of financial advice"],"answer":1,"hint":"Look at the actions in paragraphs three and four.","explanation":"Her partial scholarship and personal savings reduced the amount she needed to borrow.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Main point","question":"What does the passage mainly encourage?","options":["Avoiding university when it is expensive","Choosing the longest loan available","Considering costs, alternatives and future responsibilities before borrowing"],"answer":2,"hint":"Identify the author’s main advice.","explanation":"The story stresses informed borrowing and evaluating trade-offs.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"Why did Mariam examine her future working budget?","options":["To judge whether repayments would be manageable","To choose her favourite engineering course","To calculate her current exam marks"],"answer":0,"hint":"Connect future income with repayment obligations.","explanation":"She considered how loan repayments would fit into a future budget.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Overall meaning","question":"Which idea best summarises the text?","options":["A scholarship guarantees financial success","A careful decision can balance present opportunities with future costs","Borrowed money should be treated as a gift"],"answer":1,"hint":"Look at the final reflection on trade-offs.","explanation":"Mariam weighs present educational benefits against later financial responsibilities.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]}],"wordCount":313},{"id":5,"level":"medium","cefr":"B2.1","part":"3A","theme":"Nail That Job! | Career Trends","title":"The Internship That Changed a Career Plan","body":"When Noor joined a summer internship at a renewable-energy company, she expected to spend most of her time observing engineers. She had always imagined a career that involved solving technical problems alone. Instead, her team asked her to help create a presentation explaining energy-saving ideas to local schools. At first, she wondered whether the task was relevant to engineering.\n\nOver the next few weeks, Noor interviewed staff, checked facts and worked with a designer to turn complex information into clear messages. She discovered that strong communication helped people understand why new technology mattered. When a team member became ill, she also had to adjust the project schedule. The change was stressful, but it taught her that adaptability was not simply a word in job advertisements; it was a skill needed in everyday work.\n\nHer supervisor explained that the workforce was changing. Some routine tasks were being completed by software, while new roles required people to combine technical knowledge with creativity and teamwork. The company also collaborated remotely with specialists in other countries. For employees, this created opportunities to learn from global colleagues, although it sometimes made scheduling meetings difficult. Workers had to keep upgrading their skills rather than relying only on what they learned at university. The supervisor suggested short online courses, professional workshops and regular feedback as practical ways for employees to continue growing.\n\nAt the end of the internship, Noor presented her team's project to a group of teachers. Their questions showed her how useful practical explanations could be. She still wanted to study engineering, but her understanding of the profession had become broader. Instead of looking only for jobs with attractive titles, she began researching the tasks, working conditions and skills required. Noor came to see career planning as an ongoing process. A flexible plan, she realised, was more valuable than a fixed picture of what a particular occupation should look like.","questions":[{"skill":"Specific information","question":"What company offered Noor an internship?","options":["A fashion retailer","A renewable-energy company","A publishing house"],"answer":1,"hint":"Locate the workplace in paragraph one.","explanation":"Noor interned at a renewable-energy company.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Specific information","question":"Who was the final presentation designed for?","options":["Local schools and teachers","International investors only","Online shoppers"],"answer":0,"hint":"Look at the project purpose and final audience.","explanation":"The presentation explained energy-saving ideas to local schools and later teachers.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What unexpected task did Noor receive?","options":["Repairing a power station","Managing the company’s salaries","Explaining energy-saving ideas in a presentation"],"answer":2,"hint":"Read what the team requested in the first paragraph.","explanation":"Noor was asked to help create an educational presentation.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What taught Noor adaptability?","options":["Having to adjust a project schedule","Receiving a fixed job offer","Working without any colleagues"],"answer":0,"hint":"Find the problem caused by a team member’s absence.","explanation":"When a colleague became ill, Noor adapted the schedule.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What was a drawback of remote international collaboration?","options":["No opportunities to learn","Difficulty scheduling meetings","A ban on technology"],"answer":1,"hint":"Find the contrast after global opportunities.","explanation":"Working across countries sometimes made meeting schedules difficult.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Main point","question":"What is the passage mainly about?","options":["Why all graduates should become designers","How software has replaced all engineers","Why career success requires varied and developing skills"],"answer":2,"hint":"Consider what Noor learns beyond technical knowledge.","explanation":"The text emphasises communication, teamwork, adaptability and ongoing learning.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"Why did Noor begin researching tasks rather than job titles?","options":["She realised job titles do not reveal the full nature of work","She no longer wanted to work","She thought all occupations were identical"],"answer":0,"hint":"Connect her internship experience to her final choice.","explanation":"Her experience showed that a profession includes tasks and skills she had not expected.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Overall meaning","question":"Which statement best reflects Noor’s conclusion?","options":["A career plan should never change","Flexibility helps people respond to changing work demands","Technical knowledge has no value"],"answer":1,"hint":"Read the final two sentences.","explanation":"Noor decides that a flexible career plan is more useful than a rigid idea of a job.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]}],"wordCount":316},{"id":6,"level":"hard","cefr":"B2.2","part":"3B","theme":"Nail That Job! | A Man’s or a Woman’s Job?","title":"Can Hiring Software Be Fair?","body":"A growing number of companies use computer systems to sort job applications before a human recruiter reads them. Supporters argue that such tools save time and help employers assess thousands of applicants consistently. However, consistency is not necessarily the same as fairness. If a system learns patterns from past hiring decisions, it may reproduce disadvantages that already exist in the workplace.\n\nImagine a company that historically employed mostly men in technical leadership roles. If its screening software is trained to identify applicants similar to previous successful employees, the system could undervalue candidates whose experience follows a different path. A parent who took a career break, for example, might have excellent skills but a less conventional employment record. The software does not need an instruction to discriminate; a biased pattern in the data can be enough.\n\nSome employers respond by removing names and photographs from applications. This may reduce certain forms of bias, but it cannot solve every problem. Other information, including career gaps or particular qualifications, can still affect the result. Experts therefore recommend checking whether the system treats different groups fairly and giving rejected applicants a meaningful way to challenge decisions. Human oversight is important, although human judgement can also contain bias. A reviewer should be able to explain why an applicant was accepted or rejected and check whether the same standards were applied to comparable candidates.\n\nThe debate raises a broader question about responsibility. A business cannot claim that an unfair decision is acceptable simply because a computer produced it. Equally, rejecting technology altogether would ignore its potential to improve recruitment when it is carefully designed and monitored. The real challenge is to establish transparent criteria, test outcomes and remain willing to correct mistakes. Fair hiring is not achieved by choosing between people and machines; it depends on how both are held accountable for their decisions.","questions":[{"skill":"Detail","question":"Why do some employers use screening software?","options":["To remove every human recruiter permanently","To process many applications efficiently","To guarantee no applicant will be rejected"],"answer":1,"hint":"Review the supporters’ argument in the opening paragraph.","explanation":"Supporters say the tools save time when assessing large numbers of applications.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What could disadvantage a qualified applicant in the example?","options":["A non-traditional employment history","A high level of technical skill","A recommendation from a teacher"],"answer":0,"hint":"Find the example of a candidate with a career break.","explanation":"The text explains that a parent with a career break may be undervalued.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What do experts recommend besides checking fairness?","options":["Keeping all screening criteria secret","Using only photographs in applications","Allowing rejected candidates to challenge decisions"],"answer":2,"hint":"Read the recommended safeguards in paragraph three.","explanation":"Experts recommend oversight and a meaningful way for applicants to challenge decisions.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Tone","question":"How would you describe the writer’s attitude towards hiring software?","options":["Unconditionally enthusiastic","Cautiously balanced and critical","Completely dismissive of all technology"],"answer":1,"hint":"Notice both potential benefits and the safeguards required.","explanation":"The author recognises efficiency but stresses fairness, transparency and responsibility.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"Why might removing names not eliminate bias?","options":["Other information can still reveal unequal career patterns","It automatically removes applicants’ skills","Software cannot read documents without names"],"answer":0,"hint":"Look for examples of information that remains.","explanation":"Career gaps and qualifications can still influence software even when names are removed.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"What might happen if a company trains software on historically biased hiring records?","options":["The system will identify and fix every inequality","The data will become irrelevant to hiring","The system may repeat existing unfair patterns"],"answer":2,"hint":"Connect past decisions to the model’s new choices.","explanation":"The passage warns that training on past decisions can reproduce earlier disadvantages.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Connections","question":"Which principle links human oversight and algorithm testing?","options":["Efficiency is more important than justice","Both people and technology must be accountable","Only humans should make recruitment decisions"],"answer":1,"hint":"Consider the final paragraph’s wider question.","explanation":"The author argues that fairness requires accountable decisions from both people and software.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Overall meaning","question":"What is the central message of the passage?","options":["Fair recruitment depends on how systems are designed and monitored","Digital recruitment is always unfair","Gender is the only factor influencing employment"],"answer":0,"hint":"Choose a conclusion that accounts for opportunities and risks.","explanation":"The passage argues for transparent criteria, monitoring and correction, not total rejection or blind trust.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]}],"wordCount":308},{"id":7,"level":"hard","cefr":"B2.2","part":"3B","theme":"Money Talks | Consumerism and the Human Brain","title":"The Hidden Price of Fast Fashion","body":"Online retailers can now introduce clothing collections at remarkable speed. New designs appear on screens almost daily, and low prices make purchasing an extra shirt seem harmless. For many young consumers, shopping is also a social activity: friends share recommendations, influencers display new outfits, and limited-time offers create excitement. Yet the price shown at checkout tells only part of the story.\n\nProducing inexpensive clothing often involves complex international supply chains. Materials must be grown or manufactured, fabrics coloured, garments assembled, and products transported between countries. These processes use water, energy and labour. Although responsible practices vary between companies, environmental organisations warn that rapidly replacing clothing can increase waste and pressure on resources. A low selling price does not necessarily reflect these wider costs. The effects may be spread across different communities, making them difficult for an individual shopper to see. As a result, the apparent bargain can hide consequences far beyond the shop.\n\nConsumers face a difficult balance. Choosing the cheapest item may be necessary for someone with a limited income, and expensive clothes are not automatically produced ethically. Telling people simply to \"buy better\" can overlook the role of company policies, wages and national regulations. On the other hand, individual decisions still matter. Repairing damaged clothes, sharing items and buying only what is likely to be worn can reduce unnecessary demand.\n\nSome brands promote recycling programmes, but the benefits depend on what happens to the collected clothes. If garments are shipped elsewhere without useful reuse, the programme may improve a brand's image more than its environmental impact. Asking questions about durability and production practices can therefore be more revealing than trusting a single green label. The aim is not to make shoppers feel guilty for every purchase. It is to understand that convenience has consequences and that lasting change requires both informed consumers and responsible businesses.","questions":[{"skill":"Detail","question":"What makes new clothing purchases feel attractive online?","options":["The absence of social influence","Frequent new collections and limited-time offers","The complete transparency of all supply chains"],"answer":1,"hint":"Identify the shopping influences in the introduction.","explanation":"Daily designs, social recommendations and time-limited offers can create excitement.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"Which resources does clothing production use?","options":["Only recycled paper","No energy when sold online","Water, energy and labour"],"answer":2,"hint":"Find the listed costs of supply chains.","explanation":"The second paragraph explicitly names water, energy and labour.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"When may a clothing recycling programme be less effective?","options":["When collected items are not usefully reused","When shoppers repair clothing at home","When products are designed to last longer"],"answer":0,"hint":"Read the condition introduced in the final paragraph.","explanation":"A collection scheme may do little if clothes are shipped away without useful reuse.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Tone","question":"What is the tone of the writer?","options":["Accusatory towards low-income shoppers","Thoughtful and cautiously critical","Celebratory about constant consumption"],"answer":1,"hint":"Notice the acknowledgement of affordability and shared responsibility.","explanation":"The author examines harm without blaming every shopper and argues for systemic as well as individual action.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"Why does the author mention that expensive clothes are not always ethical?","options":["To show price alone is not a reliable guide to responsibility","To prove cheap clothes always last longer","To suggest environmental effects are imaginary"],"answer":0,"hint":"Link the sentence to the discussion of difficult choices.","explanation":"The writer cautions against assuming that a high price guarantees ethical production.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"What can be inferred about a brand that advertises recycling without tracking results?","options":["It has necessarily eliminated all waste","Its products must be made locally","Its environmental claim may be more promotional than practical"],"answer":2,"hint":"Consider the difference between image and impact.","explanation":"The text says a programme without useful reuse may improve brand image more than impact.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Connections","question":"How are consumer choices and business policies connected?","options":["They have no influence on each other","Both influence the environmental effects of clothing","Consumers alone control production conditions"],"answer":1,"hint":"Combine the final sentences with the discussion of wages and regulation.","explanation":"The author says lasting change requires informed consumers and responsible businesses.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Overall meaning","question":"What is the best summary of the passage?","options":["The true costs of fashion involve more than the checkout price","Every inexpensive item should be banned","Recycling programmes always solve fashion waste"],"answer":0,"hint":"Find the theme linking purchasing, production and reuse.","explanation":"The passage explores hidden environmental and social costs, plus shared responsibility for them.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]}],"wordCount":308},{"id":8,"level":"hard","cefr":"B2.2","part":"3B","theme":"Nail That Job! | Career Trends","title":"Remote Work: Freedom for Everyone?","body":"Telecommuting has changed how many organisations think about the workplace. For an employee who lives far from a city, working remotely may remove a long daily journey and make it easier to manage family responsibilities. Companies can sometimes recruit people from a wider range of locations. These advantages have encouraged some commentators to describe remote work as a universal solution to modern employment problems.\n\nThe reality is more complicated. Many occupations, including nursing, construction and hospitality, require people to be physically present. Even in jobs that can be completed online, employees may not have equal access to quiet rooms, reliable internet connections or suitable equipment. A flexible policy can therefore benefit workers differently. A new graduate sharing a small apartment may experience a very different working day from an experienced employee with a dedicated home office.\n\nManagers also face new challenges. Without informal conversations in an office, inexperienced staff might miss chances to learn from colleagues. Some employers attempt to measure productivity by monitoring time spent online, but this can confuse visible activity with meaningful results. Teams often respond more effectively by agreeing on clear goals, regular communication and opportunities for mentoring. Occasional in-person meetings can also strengthen relationships when travel is possible. However, these gatherings need to be planned with care so that employees who cannot travel easily are not excluded from important conversations or decisions.\n\nNone of these difficulties means that companies should return automatically to rigid schedules. Instead, remote work may be most effective when organisations recognise different needs and allow several reasonable arrangements. Employees should be judged on their contributions rather than on whether they sit at the same desk every day. The deeper lesson is that flexibility is not simply a location. It is the ability to design working conditions that support both performance and fairness. Achieving that goal requires more than handing workers a laptop and telling them to work from home.","questions":[{"skill":"Detail","question":"How can remote work help someone living far from a city?","options":["It can eliminate a long daily commute","It guarantees a higher salary","It removes all family responsibilities"],"answer":0,"hint":"Look at the first example of a remote-work benefit.","explanation":"The writer says telecommuting can remove a lengthy daily journey.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"Which jobs are mentioned as requiring physical presence?","options":["Only software development roles","Nursing, construction and hospitality","Only jobs in financial services"],"answer":1,"hint":"Read the concrete examples in paragraph two.","explanation":"The passage specifically lists nursing, construction and hospitality.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What is one weakness of tracking employees’ online time?","options":["It always improves mentoring","It creates more reliable internet","It may measure visible activity rather than useful results"],"answer":2,"hint":"Look for the writer’s criticism of online monitoring.","explanation":"Monitoring time online can confuse apparent activity with meaningful productivity.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Tone","question":"How does the writer view remote work?","options":["As a perfect solution for all workers","As useful but requiring thoughtful design","As a temporary mistake with no benefits"],"answer":1,"hint":"Look for contrasting benefits and limitations.","explanation":"The author supports flexibility while examining unequal resources and management challenges.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"Why might a new graduate benefit from some in-person work?","options":["It could provide informal learning and mentoring","It would make all digital tools unnecessary","It would guarantee promotion"],"answer":0,"hint":"Connect office conversations with inexperienced employees.","explanation":"The text suggests less experienced staff can miss informal learning when isolated.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"Why are different remote-work arrangements recommended?","options":["Every employee has the same home conditions","Employers must avoid evaluating results","Workers have different roles and resources"],"answer":2,"hint":"Consider the inequalities described in paragraph two.","explanation":"Jobs and home environments differ, so a single arrangement is not fair for everyone.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Connections","question":"Which link does the author establish between flexibility and fairness?","options":["More flexibility always means less accountability","Flexible policies should recognise unequal needs and judge contributions","Fairness requires identical schedules for all workers"],"answer":1,"hint":"Read the final paragraph’s definition of flexibility.","explanation":"The writer links fairness to tailored arrangements and evaluation based on actual contributions.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Overall meaning","question":"Which statement best captures the passage?","options":["Successful remote work depends on inclusive policies, not location alone","Every worker should permanently stay home","Online monitoring is the only way to ensure success"],"answer":0,"hint":"Consider the author’s final lesson.","explanation":"The main argument is that remote work works best when conditions, goals and fairness are considered together.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]}],"wordCount":318},{"id":9,"level":"challenge","cefr":"C1","part":"C1","theme":"Money Talks | Consumerism and Advertising","title":"When Ethical Branding Becomes a Sales Strategy","body":"A growing number of businesses promote products as sustainable, responsible or socially conscious. Such claims appeal to consumers who want their spending to reflect their values. In principle, this shift can reward companies that improve working conditions or reduce environmental harm. In practice, however, it has also created an uncomfortable question: when does an ethical promise communicate real progress, and when does it function mainly as a marketing device?\n\nConsider a clothing company that advertises a small collection made from recycled material. The initiative may represent genuine improvement, but it tells customers little about the rest of the business. If the company continues producing enormous quantities of short-lived clothing, its overall environmental impact might remain high. A striking advertisement can direct attention towards one positive feature while leaving less flattering information outside the frame. Researchers often describe this selective presentation as greenwashing when it produces a misleading impression of environmental responsibility.\n\nThe problem is not always a straightforward lie. Statements such as \"better for the planet\" may be too vague to evaluate. A percentage reduction in packaging, for instance, sounds impressive until customers discover that packaging accounts for only a small share of the product's total impact. Meaningful comparisons require clear measurements, a defined starting point and, where possible, independent verification. Without these, shoppers may struggle to distinguish improvement from clever language.\n\nThere is also a paradox in asking consumers to purchase more items as proof of environmental concern. Buying a newly advertised reusable product may have little benefit if the customer already owns something that works. Responsible consumption sometimes means repairing, borrowing or simply not buying. Yet consumers cannot investigate every supply chain, and it would be unreasonable to place the full burden of verification on individuals. Regulators, journalists and businesses themselves must make reliable information more accessible.\n\nThe most credible ethical brands are therefore not necessarily those with the loudest promises. They are the ones willing to report limitations, publish comparable evidence and accept scrutiny. Ethical marketing becomes valuable when it increases understanding rather than merely transforming concern into another reason to shop.","questions":[{"skill":"Detail","question":"What can a recycled clothing collection fail to reveal?","options":["The precise age of each shopper","The environmental impact of the company’s wider production","Whether recycled materials have any uses"],"answer":1,"hint":"Examine the contrast between one collection and the entire business.","explanation":"The example says a small recycled line may conceal continuing large-scale production impacts.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"Which feature strengthens an environmental comparison?","options":["A vague adjective without evidence","A celebrity endorsement alone","Measurements, a baseline and independent verification"],"answer":2,"hint":"Look at the criteria in paragraph three.","explanation":"The writer calls for clear measurements, a defined starting point and ideally independent checking.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What alternative to buying is explicitly suggested?","options":["Repairing or borrowing existing products","Buying every labelled sustainable item","Ignoring all product information"],"answer":0,"hint":"Read the discussion of responsible consumption.","explanation":"The text states that responsible consumption can mean repairing, borrowing or not buying.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Tone","question":"How would you best describe the author’s stance?","options":["Critically discerning rather than hostile to all ethical marketing","Unquestioningly supportive of sustainability labels","Indifferent to consumer trust"],"answer":0,"hint":"Notice where the writer acknowledges potential improvements.","explanation":"The author accepts that ethical marketing can reward progress, but demands evidence and scrutiny.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"Why might a percentage reduction in packaging be misleading?","options":["Any reduction must increase pollution","The improvement may concern a minor part of total impact","Consumers never understand percentages"],"answer":1,"hint":"Distinguish a local improvement from an overall result.","explanation":"A packaging reduction may be small relative to the total environmental footprint.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"Why does the writer object to placing all verification duties on consumers?","options":["Consumers should never question advertising","Governments are the only groups who can buy sustainably","Individuals cannot realistically investigate every supply chain"],"answer":2,"hint":"Look at the paragraph on shared responsibility.","explanation":"The text states that verifying every supply chain is an unreasonable task for individuals alone.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Connections","question":"Which tension does the author identify between marketing and responsible consumption?","options":["Advertising may encourage new purchases when restraint would be better","Marketing always reduces production","Buying more is the only way to show environmental concern"],"answer":0,"hint":"Connect the discussion of shopping to environmental concern.","explanation":"The text highlights the paradox of encouraging more buying in the name of reducing harm.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Overall meaning","question":"What is the author’s main criterion for credible ethical branding?","options":["Attractive packaging and memorable slogans","Transparent, comparable and verifiable evidence","The largest possible number of product launches"],"answer":1,"hint":"Read the conclusion for the central standard.","explanation":"Credibility comes from reporting limitations and publishing evidence open to scrutiny.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]}],"wordCount":346},{"id":10,"level":"challenge","cefr":"C1","part":"C1","theme":"Nail That Job! | A Man’s or a Woman’s Job?","title":"Beyond the Gender-Neutral Job Advertisement","body":"Imagine two employers advertising the same engineering vacancy. Both use gender-neutral language, promise equal opportunities and evaluate applicants against clearly stated criteria. On the surface, they appear equally committed to fairness. Yet one organisation consistently promotes women into senior roles, while the other retains very few women beyond entry level. The contrast suggests that fair recruitment cannot be assessed solely by examining the words in a job advertisement.\n\nOne explanation lies in how opportunities are distributed after hiring. Employees may gain valuable experience through challenging projects, professional networks and informal guidance from senior colleagues. If these opportunities are allocated through personal connections rather than transparent processes, certain groups may repeatedly be overlooked. A worker can meet every formal requirement for promotion and still lack access to the experiences that decision-makers later reward. The obstacle is not necessarily an openly discriminatory rule; it may be an accumulation of small, unequal decisions.\n\nCare responsibilities add another dimension. Workers of any gender may need flexible schedules, but employees who use such arrangements can sometimes be perceived as less committed. When performance is judged partly by hours spent visibly in the office, a policy described as \"family-friendly\" may offer limited protection. An organisation must therefore examine whether the culture supports flexibility in practice, not simply whether the policy exists on paper.\n\nSome critics worry that efforts to improve representation could replace merit with numerical targets. This concern deserves careful consideration, particularly when targets are used without attention to qualifications or job requirements. Nevertheless, the assumption that existing systems automatically recognise merit is equally questionable. Performance measures can reflect unequal access to high-profile assignments, mentoring or sponsorship. Better evaluation involves making expectations explicit and testing whether similar contributions receive similar recognition.\n\nThis approach requires more than training staff to avoid biased language. Organisations can examine promotion data, ask employees about barriers and revise how developmental opportunities are assigned. None of these steps guarantees perfect fairness, but they make hidden practices more visible and correctable. A gender-neutral advertisement may open the door; whether people can advance after entering depends on the structures they encounter inside.","questions":[{"skill":"Detail","question":"What difference exists between the two employers in the opening example?","options":["They advertise different engineering vacancies","They offer opposite salary structures","Their records of women advancing to senior roles differ"],"answer":2,"hint":"Identify the contrast after the shared hiring language.","explanation":"Both advertise similarly, but only one consistently promotes women to senior posts.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"Which opportunities can influence later promotion?","options":["Challenging projects, networks and senior guidance","Only the font used on applications","A guarantee of immediate management status"],"answer":0,"hint":"Read how experience is distributed after recruitment.","explanation":"The passage names projects, networks and guidance as routes to career development.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Detail","question":"What can weaken a family-friendly policy?","options":["Employees knowing the written policy","A culture that judges commitment by visible office hours","Clear performance criteria"],"answer":1,"hint":"Look for a mismatch between policy and behaviour.","explanation":"The text says office visibility can undermine flexible-working policies.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Tone","question":"What tone does the writer adopt toward representation targets?","options":["Completely dismissive of concerns about merit","Enthusiastic about numerical targets regardless of context","Measured, recognising criticism while questioning assumptions"],"answer":2,"hint":"Read the section addressing critics and qualifications.","explanation":"The author takes merit concerns seriously but also challenges the belief that existing systems are automatically fair.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"Why may apparently neutral promotion criteria produce unequal outcomes?","options":["Candidates may have had unequal access to valued experience","All employees refuse mentoring","Neutral wording removes the need for evaluation"],"answer":0,"hint":"Connect valued qualifications to earlier access to opportunities.","explanation":"Unequal access to assignments and guidance can shape the records used in supposedly neutral promotion decisions.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Inference","question":"What does the text imply about fairness training alone?","options":["It always prevents unequal outcomes","It is insufficient without changes to workplace practices","It is the same as publishing promotion data"],"answer":1,"hint":"Find the argument in the final paragraph.","explanation":"The writer says fairness requires examining data and opportunity allocation, not just language training.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Connections","question":"Which relationship does the author establish between merit and opportunity?","options":["Merit is unrelated to experience","Numerical targets automatically measure merit","Assessments of merit may reflect unequal chances to develop and demonstrate skills"],"answer":2,"hint":"Link challenging assignments with later performance evaluation.","explanation":"The text argues that measures of merit can be shaped by who received developmental opportunities.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]},{"skill":"Overall meaning","question":"What is the passage’s main argument?","options":["Fair employment needs attention to opportunities and organisational culture after hiring","Gender-neutral advertisements alone solve career inequality","Promotion should depend mainly on personal connections"],"answer":0,"hint":"Consider the opening and closing metaphor of the doorway.","explanation":"The author argues that genuine fairness must extend beyond recruitment to advancement and workplace structures.","wrong":["Re-read the evidence in the text before choosing.","This choice does not match the passage.","This option is not supported by the passage."]}],"wordCount":349}];
const KEY='grade12-reading-lab-v2026-11';
const LEVELS={easy:{ar:'سهل',cls:'green'},medium:{ar:'متوسط',cls:'gold'},hard:{ar:'صعب',cls:'rose'},challenge:{ar:'تحدّي C1',cls:'violet'}};
const SKILL_AR={'Specific information':'معلومة محددة','Detail':'فهم التفاصيل','Main point':'الفكرة الرئيسة','Inference':'الاستنتاج','Overall meaning':'المعنى العام','Tone':'نبرة الكاتب','Connections':'الربط بين الأفكار'};
const ANSWER_LABELS=['A','B','C'];

document.documentElement.style.setProperty('--font-scale',scale);
