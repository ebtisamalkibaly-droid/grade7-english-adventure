function load(){try{const value=JSON.parse(localStorage.getItem(KEY)||'{}');return value&&typeof value==='object'?value:{sessions:{},dark:false,scale:1};}catch(e){return {sessions:{},dark:false,scale:1};}}
if(!state.sessions||typeof state.sessions!=='object')state.sessions={};
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));}catch(e){/* local file/private mode: website still works for the current session */}}
function esc(str){return String(str).replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));}
function getSession(id){if(!state.sessions[id])state.sessions[id]={answers:{}};if(!state.sessions[id].answers)state.sessions[id].answers={};return state.sessions[id];}
function getResult(id,index){return getSession(id).answers[index]||{attempts:0,tried:[],status:'new'};}
function counts(p){const results=p.questions.map((_,i)=>getResult(p.id,i));return {done:results.filter(r=>r.status==='correct'||r.status==='failed').length,first:results.filter(r=>r.status==='correct'&&r.attempts===1).length,mastered:results.filter(r=>r.status==='correct').length};}
function allStats(){let done=0,first=0,mastered=0;for(const p of PASSAGES){let s=counts(p);done+=s.done;first+=s.first;mastered+=s.mastered;}return {done,first,mastered,passages:PASSAGES.filter(p=>counts(p).done===8).length};}
function badge(p){const lv=LEVELS[p.level];return `<span class="pill ${lv.cls}">${lv.ar} · ${p.cefr}</span>`;}
function meter(n,total=8){return `<div class="meter" role="progressbar" aria-valuenow="${n}" aria-valuemin="0" aria-valuemax="${total}"><span style="width:${n/total*100}%"></span></div>`;}
function home(){page=null;document.title='Reading Lab | Grade 12 General';const s=allStats();const shown=PASSAGES.filter(p=>filter==='all'||p.level===filter);const recommended=PASSAGES.find(p=>counts(p).done<8)||PASSAGES[0];return `<div class="dash"><section class="hero"><div class="eyebrow" dir="ltr">READ · THINK · LEARN</div><h1>رحلتكِ لإتقان الفهم والاستيعاب</h1><p>10 نصوص إنجليزية، 80 سؤالًا، ومحاولتان لكل إجابة. تدرّبي على أسئلة الامتحان واحصلي على شرح يساعدك على فهم أخطائك.</p><div class="hero-buttons"><button type="button" class="solid" data-open="${recommended.id}">ابدئي أو واصلي التدريب ←</button><button type="button" class="outline" data-action="scroll-list">استعرضي النصوص</button></div><div class="hero-tags"><span class="tag">A / B / C Questions</span><span class="tag">Two Attempts</span><span class="tag">Instant Feedback</span><span class="tag">B2.1 · B2.2 · C1</span></div></section>
<section class="summary" aria-label="إحصاءات التقدّم"><div class="stat"><div class="small">التمارين المكتملة</div><div class="num">${s.passages}<small style="font-size:.83rem;color:var(--sub)"> / 10</small></div></div><div class="stat"><div class="small">الأسئلة المنتهية</div><div class="num">${s.done}<small style="font-size:.83rem;color:var(--sub)"> / 80</small></div></div><div class="stat"><div class="small">الصحيح من أول مرة</div><div class="num">${s.first}</div></div><div class="stat"><div class="small">الإجابات الصحيحة النهائية</div><div class="num">${s.mastered}</div></div></section>
<section id="passages"><div class="section-heading"><h2>اختاري نصّ القراءة</h2><small>من الأسهل إلى الأكثر تحدّيًا</small></div><nav class="filters" aria-label="تصفية حسب الصعوبة">${[['all','كل المستويات'],['easy','سهل (2)'],['medium','متوسط (3)'],['hard','صعب (3)'],['challenge','C1 (2)']].map(([key,val])=>`<button type="button" class="chip ${filter===key?'active':''}" data-filter="${key}" aria-pressed="${filter===key}">${val}</button>`).join('')}</nav>
<div class="passage-grid">${shown.map(p=>{let c=counts(p);return `<article class="passage-card"><div class="card-top">${badge(p)}<span class="number">TEXT ${String(p.id).padStart(2,'0')}</span></div><div><h3 dir="ltr" style="text-align:left">${esc(p.title)}</h3><p dir="ltr" class="card-theme" style="text-align:left">${esc(p.theme)}</p></div><div class="card-details"><span>${p.wordCount} words</span><span>· 8 questions</span><span>· ${p.part==='3A'?'24 marks':p.part==='3B'?'16 marks':'Challenge'}</span></div><div class="card-bottom">${meter(c.done)}<div class="meta-row"><span>التقدّم: <b dir="ltr" style="unicode-bidi:isolate">${c.done}/8</b></span><span>من أول مرة: <b dir="ltr" style="unicode-bidi:isolate">${c.first}/8</b></span></div><button type="button" class="solid btn-wide" data-open="${p.id}">${c.done===8?'راجعي إجاباتكِ':c.done?'واصلي التدريب':'ابدئي القراءة'} ←</button></div></article>`}).join('')}</div></section>
<section class="guide"><span style="font-size:1.4rem" aria-hidden="true">✦</span><div><b>كيف تعمل المحاولتان؟</b><div>إذا كانت الإجابة الأولى غير صحيحة، سيظهر سبب عدم ملاءمة الاختيار مع تلميح من النص، وتبقى محاولة ثانية. بعد المحاولة الثانية ستظهر الإجابة الصحيحة ودليلها. النتيجة تميّز بين الإجابة الصحيحة من أول مرة والإتقان بعد المراجعة.</div><small>المستوى الرسمي للامتحان: B2.1 في Part 3A وB2.2 في Part 3B. النصوص السهلة دعم تدريجي، ونصّا C1 تحدٍّ إضافي.</small></div></section><div style="text-align:center"><button type="button" class="ghost" data-action="reset-all">إعادة ضبط جميع نتائج التدريب</button></div></div>`;}
function optionClass(q,r,j){if(r.status==='correct'&&j===q.answer)return 'selected-right';if(r.status==='failed'&&j===q.answer)return 'reveal-right';if((r.tried||[]).includes(j)&&j!==q.answer)return 'selected-wrong';return '';}
function feedback(q,r){if(!r.attempts)return '';const last=r.tried[r.tried.length-1];if(r.status==='correct')return `<div class="response success" role="status"><div class="arabic">✓ ${r.attempts===1?'إجابة صحيحة من أول محاولة!':'ممتاز! الإجابة صحيحة في المحاولة الثانية.'}</div><div class="detail"><strong>Evidence:</strong> ${esc(q.explanation)}</div></div>`;
if(r.status==='failed')return `<div class="response error" role="status"><div class="arabic">انتهت المحاولتان. الإجابة الصحيحة: ${ANSWER_LABELS[q.answer]}.</div><div class="detail"><strong>Correct answer:</strong> ${esc(q.options[q.answer])}<br><strong>Why?</strong> ${esc(q.explanation)}</div></div>`;
return `<div class="response warn" role="status"><div class="arabic">ليست الإجابة الصحيحة. بقيت محاولة واحدة. هذا الاختيار لا يوافق ما ورد في النص.</div><div class="detail"><strong>Why not ${ANSWER_LABELS[last]}?</strong> The choice “${esc(q.options[last])}” conflicts with the information in the text.<br><strong>Text evidence:</strong> ${esc(q.explanation)}<br><strong>Reading tip:</strong> ${esc(q.hint)}</div></div>`;}
function question(p,q,i){let r=getResult(p.id,i);let done=r.status==='correct'||r.status==='failed';return `<article class="question ${r.status==='correct'?'answered':r.status==='failed'?'failed':''}" id="q${i+1}" aria-label="Question ${i+1}"><div class="q-head"><span class="q-no">QUESTION ${String(i+1).padStart(2,'0')}</span><span class="q-type">${esc(q.skill)}</span></div><h3>${esc(q.question)}</h3><div class="options">${q.options.map((o,j)=>`<button type="button" class="choice ${optionClass(q,r,j)}" data-answer="${p.id}:${i}:${j}" ${done||(r.tried||[]).includes(j)?'disabled':''} aria-label="Option ${ANSWER_LABELS[j]}: ${esc(o)}"><span class="letter">${ANSWER_LABELS[j]}</span><span>${esc(o)}</span></button>`).join('')}</div>${feedback(q,r)}<div class="attempts">${r.attempts?'عدد المحاولات المستخدمة: '+r.attempts+' / 2':'المحاولات المتاحة: 2'}</div></article>`;}
function practice(p){page=p.id;document.title=p.title+' | Reading Lab';const c=counts(p);return `<section class="practice-top"><button type="button" class="back" data-action="home">→ العودة إلى النصوص</button><div class="practice-tools"><span class="pill">${p.wordCount} words</span><button type="button" class="ghost" data-action="print">طباعة النص والأسئلة</button><button type="button" class="ghost" data-reset="${p.id}">إعادة المحاولة من البداية</button></div></section><div class="practice-head"><div class="head-line"><div>${badge(p)}<h1 dir="ltr" style="text-align:left">${esc(p.title)}</h1><p class="theme" dir="ltr" style="text-align:left">${esc(p.theme)}</p></div><div class="practice-info"><span class="pill">${p.part==='3A'?'Exam Part 3A':p.part==='3B'?'Exam Part 3B':'C1 Extension'}</span><span class="pill ${c.done===8?'green':''}" dir="ltr">${c.done} / 8 completed</span></div></div><div style="margin-top:17px">${meter(c.done)}</div><div class="meta-row" style="margin:8px 0 0"><span>الصحيح من أول مرة: <b dir="ltr" style="unicode-bidi:isolate">${c.first}/8</b></span><span>الإتقان خلال محاولتين: <b dir="ltr" style="unicode-bidi:isolate">${c.mastered}/8</b></span></div></div>
${c.done===8?`<div class="completion"><div><h3>🎉 أنهيتِ هذا النص!</h3><p>صحيح من أول مرة: ${c.first} من 8 · صحيح خلال محاولتين: ${c.mastered} من 8. راجعي الأدلة ثم انتقلي إلى نص آخر.</p></div><button type="button" class="solid" data-open="${p.id<10?p.id+1:1}">${p.id<10?'النص التالي':'العودة للنص الأول'} ←</button></div>`:''}
<div class="study-layout"><section class="pane" aria-label="Reading text"><div class="pane-head"><h2>READING PASSAGE</h2><small>Read carefully</small></div><div class="reader" id="readingPane"><div class="story" lang="en">${p.body.split(/\n\s*\n/).map(para=>`<p>${esc(para.trim())}</p>`).join('')}</div></div></section><section class="pane" aria-label="Comprehension questions"><div class="pane-head"><h2>COMPREHENSION CHECK</h2><small>Choose A, B or C</small></div><div class="questions-pane" id="questionPane"><div class="question-list">${p.questions.map((q,i)=>question(p,q,i)).join('')}</div></div></section></div><div class="legend" style="direction:rtl;text-align:right"><b>نصيحة:</b> اقرئي السؤال أولاً، ثم ابحثي عن الدليل في النص. الأسئلة تشبه Part ${p.part==='C1'?'3B (تحدٍّ إضافي)':' '+p.part} من امتحان نهاية الفصل، لكن هذا التدريب ليس اختبارًا رسميًا.</div><div style="display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap;padding:5px 0 24px"><button type="button" class="outline" data-action="home">جميع النصوص</button>${p.id<10?`<button type="button" class="solid" data-open="${p.id+1}">النص التالي ←</button>`:''}</div>`;}
function render(opts={}){const pane=document.getElementById('readingPane'),qp=document.getElementById('questionPane');const readY=pane?pane.scrollTop:0,qY=qp?qp.scrollTop:0,winY=window.scrollY;const app=document.getElementById('app');app.innerHTML=page===null?home():practice(PASSAGES[page-1]);if(opts.preserve){const rp=document.getElementById('readingPane'),np=document.getElementById('questionPane');if(rp)rp.scrollTop=readY;if(np)np.scrollTop=qY;window.scrollTo(0,winY);}else{window.scrollTo(0,0);}}
function openPassage(id){if(!PASSAGES[id-1])return;page=id;render();}
function answer(id,i,j){const p=PASSAGES[id-1];if(!p||!p.questions[i])return;const q=p.questions[i],session=getSession(id);const old=getResult(id,i);if(['correct','failed'].includes(old.status)||(old.tried||[]).includes(j))return;const r={attempts:old.attempts+1,tried:[...(old.tried||[]),j],status:'retry'};if(j===q.answer)r.status='correct';else if(r.attempts>=2)r.status='failed';session.answers[i]=r;save();render({preserve:true});}
function resetPassage(id){if(confirm('هل تريدين مسح إجابات هذا النص وإعادة المحاولتين لكل سؤال؟')){delete state.sessions[id];save();render({preserve:true});}}
function resetAll(){if(confirm('هل تريدين مسح التقدّم في جميع النصوص العشرة؟')){state.sessions={};save();render();}}
document.getElementById('app').addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.hasAttribute('data-open')){openPassage(Number(b.getAttribute('data-open')));return;}if(b.hasAttribute('data-answer')){const [id,i,j]=b.getAttribute('data-answer').split(':').map(Number);answer(id,i,j);return;}if(b.hasAttribute('data-filter')){filter=b.getAttribute('data-filter');render({preserve:true});return;}if(b.hasAttribute('data-reset')){resetPassage(Number(b.getAttribute('data-reset')));return;}const a=b.getAttribute('data-action');if(a==='home'){page=null;render();}else if(a==='reset-all'){resetAll();}else if(a==='print'){window.print();}else if(a==='scroll-list'){document.getElementById('passages')?.scrollIntoView({behavior:'smooth',block:'start'});}});
document.getElementById('logoLink').addEventListener('click',e=>{e.preventDefault();page=null;render();});
document.getElementById('fontUp').addEventListener('click',()=>{scale=Math.min(1.4,Math.round((scale+.1)*10)/10);document.documentElement.style.setProperty('--font-scale',scale);state.scale=scale;save();});
document.getElementById('fontDown').addEventListener('click',()=>{scale=Math.max(.8,Math.round((scale-.1)*10)/10);document.documentElement.style.setProperty('--font-scale',scale);state.scale=scale;save();});
document.getElementById('themeToggle').addEventListener('click',()=>{state.dark=!state.dark;document.body.classList.toggle('dark',state.dark);save();});
render();
</script>
</body>
</html>
