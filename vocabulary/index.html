kground:#fff;color:var(--dark);font-weight:740;padding:14px 17px}.option:hover:not(:disabled){background:#f0fbf6;border-color:#8ecbb4}.option .letter{flex:0 0 35px;width:35px;height:35px;border-radius:11px;background:#edf6f2;display:grid;place-items:center;font-weight:900}.option.selected{border-color:#0ba07e;background:#edfaf5}.option.wrong{border-color:#e87f67;background:#fff1ed}.feedback{border-radius:16px;padding:18px 20px;margin-top:20px;border:1px solid #b4decc;background:#f1fbf5}.feedback.bad{background:#fff6ec;border-color:#f3d2a5}.feedback h3{margin:0 0 7px}.feedback p{margin:5px 0}.feedback .evidence{padding:10px 13px;border-left:4px solid #18a784;background:#fff;border-radius:8px;margin:10px 0;color:#255b4b}.side{position:sticky;top:93px;padding:20px}.side p{font-size:.85rem;color:var(--muted)}.mark{background:#ffdf8f;border-radius:4px;padding:0 3px;box-decoration-break:clone}.passage{font-size:1.02rem;line-height:1.93;letter-spacing:.05px;color:#29463d}.passage p{margin:0 0 16px}.reading-shell{display:grid;grid-template-columns:minmax(0,1.24fr) minmax(0,.95fr);gap:17px;align-items:start}.reading-panel{max-height:70vh;overflow:auto;position:sticky;top:92px}.read-q{position:sticky;top:90px}.back{border:0;background:none;color:#16765f;font-weight:850;padding:6px 0}.results{text-align:center;padding:38px}.results .big{font-size:3.8rem;font-weight:1000;color:#087e66;line-height:1.2}.results h2{margin:8px 0;font-size:1.9rem}.badgelist{display:flex;gap:8px;flex-wrap:wrap}.helptext{font-size:.85rem;color:#6a857a}.numbered{font-feature-settings:'tnum'}.notice{padding:16px 20px;background:#fff8e8;border-left:4px solid #efbb62;border-radius:9px;color:#74532e}.empty{padding:45px 20px;text-align:center;color:var(--muted)}.hide{display:none!important}@media(max-width:950px){.grid4{grid-template-columns:repeat(3,minmax(0,1fr))}.reading-shell,.quiz-shell{grid-template-columns:1fr}.reading-panel,.read-q,.side{position:static;max-height:none}.setup-grid{grid-template-colu ood"},{"id":"1-10","u":1,"word":"fruit","ar":"فاكهة","meaning":"sweet food grown on plants or trees","icon":"🍎","example":"An apple is a type of fruit.","group":"food"},{"id":"1-11","u":1,"word":"vegetables","ar":"خضراوات","meaning":"plants we eat as part of meals","icon":"🥦","example":"Carrots and spinach are vegetables.","group":"food"},{"id":"1-12","u":1,"word":"beans","ar":"فاصولياء","meaning":"seeds used as nutritious food","icon":"🫘","example":"Beans contain protein that our bodies need.","group":"food"},{"id":"1-13","u":1,"word":"spinach","ar":"سبانخ","meaning":"a green leafy vegetable","icon":"🥬","example":"Spinach is a leafy vegetable.","group":"food"},{"id":"1-14","u":1,"word":"garlic","ar":"ثوم","meaning":"a strong-smelling vegetable used in cooking","icon":"🧄","example":"We add garlic to the soup.","group":"food"},{"id":"1-15","u":1,"word":"carrots","ar":"جزر","meaning":"long orange vegetables","icon":"🥕","example":"Carrots are good for our eyes.","group":"food"},{"id":"1-16","u":1,"word":"protein","ar":"بروتين","meaning":"a nutrient that helps build and repair the body","icon":"🥚","example":"Eggs and beans contain protein.","group":"nutrient"},{"id":"1-17","u":1,"word":"vitamins","ar":"فيتامينات","meaning":"substances needed to stay healthy","icon":"🍊","example":"Fruit gives us important vitamins.","group":"nutrient"},{"id":"1-18","u":1,"word":"carbohydrates","ar":"كربوهيدرات","meaning":"nutrients that give the body energy","icon":"🍞","example":"Bread and rice contain carbohydrates.","group":"nutrient"},{"id":"1-19","u":1,"word":"fat","ar":"دهون","meaning":"a nutrient that supplies energy","icon":"🧈","example":"The body needs a little fat, but not too much.","group":"nutrient"},{"id":"1-20","u":1,"word":"calcium","ar":"كالسيوم","meaning":"a mineral that helps bones stay strong","icon":"🥛","example":"Milk contains calcium for healthy bones.","group":"nutrient"},{"id":"1-21","u":1,"word":"energy","ar":"طاقة","meaning":"the ability to move and do things","icon":"⚡","example":"Our bodies need energy to run and play.","group":"nutrient"},{"id":"1-22","u":1,"word":"muscle","ar":"عضلة","meaning":"body tissue used for movement","icon":"💪","example":"Exercise can make a muscle stronger.","group":"body"},{"id":"1-23","u":1,"word":"eyes","ar":"عيون","meaning":"parts of the body used for seeing","icon":"👀","example":"We use our eyes to read.","group":"body"},{"id":"1-24","u":1,"word":"diet","ar":"نظام غذائي","meaning":"the foods a person usually eats","icon":"🥗","example":"Her diet includes fruit, vegetables and fish.","group":"health"},{"id":"1-25","u":1,"word":"exercise","ar":"تمرين رياضي","meaning":"physical movement that keeps us fit","icon":"🚴","example":"Daily exercise helps keep our bodies healthy.","group":"health"},{"id":"1-26","u":1,"word":"breakfast","ar":"فطور","meaning":"the first meal of the day","icon":"🥣","example":"A good breakfast gives students energy.","group":"meal"},{"id":"1-27","u":1,"word":"meal","ar":"وجبة","meaning":"food eaten at one time","icon":"🍽️","example":"Lunch is an important meal.","group":"meal"},{"id":"1-28","u":1,"word":"recipe","ar":"وصفة طعام","meaning":"instructions for making a dish","icon":"📃","example":"Follow the recipe to make an omelet.","group":"foodprocess"},{"id":"1-29","u":1,"word":"ingredients","ar":"مكونات","meaning":"foods needed to prepare a dish","icon":"🥣","example":"Eggs and tomatoes are ingredients in the recipe.","group":"foodprocess"},{"id":"1-30","u":1,"word":"leftovers","ar":"بقايا الطعام","meaning":"food remaining after a meal","icon":"🥡","example":"We can save leftovers for tomorrow.","group":"foodprocess"},{"id":"1-31","u":1,"word":"food waste","ar":"هدر الطعام","meaning":"food thrown away without being eaten","icon":"🗑️","example":"Planning meals helps reduce food waste.","group":"foodprocess"},{"id":"1-32","u":1,"word":"recycle","ar":"يعيد التدوير","meaning":"use something again to make a new product","icon":"♻️","example":"We recycle plastic bottles after lunch.","group":"action"},{"id":"1-33","u":1,"word":"throw away","ar":"يرمي","meaning":"put something in the rubbish","icon":"🗑️","example":"Do not throw away food that is still good.","group":"action"},{"id":"1-34","u":1,"word":"avoid","ar":"يتجنب","meaning":"stay away from something","icon":"🚫","example":"We should avoid eating too much sugar.","group":"action"},{"id":"1-35","u":1,"word":"skip","ar":"يتخطى","meaning":"miss something on purpose","icon":"⏭️","example":"Do not skip breakfast before school.","group":"action"},{"id":"1-36","u":1,"word":"both","ar":"كلاهما","meaning":"the two things together","icon":"✌️","example":"We need both fruit and vegetables in our diet.","group":"link"},{"id":"1-37","u":1,"word":"also","ar":"أيضًا","meaning":"in addition","icon":"➕","example":"Vegetables contain vitamins and also provide fibre.","group":"link"},{"id":"1-38","u":1,"word":"first","ar":"أولاً","meaning":"at the beginning","icon":"1️⃣","example":"First, wash the vegetables before cooking.","group":"sequence"},{"id":"1-39","u":1,"word":"next","ar":"بعد ذلك","meaning":"immediately after a step","icon":"➡️","example":"Next, cut the carrots into small pieces.","group":"sequence"},{"id":"1-40","u":1,"word":"finally","ar":"أخيرًا","meaning":"at the end of a process","icon":"🏁","example":"Finally, serve the soup while it is warm.","group":"sequence"},{"id":"1-41","u":1,"word":"food chain","ar":"سلسلة غذائية","meaning":"a sequence showing what eats what","icon":"🔗","example":"Grass, rabbit and fox form a food chain.","group":"ecology"},{"id":"1-42","u":1,"word":"food web","ar":"شبكة غذائية","meaning":"several connected food chains","icon":"🕸️","example":"A food web shows several food chains together.","group":"ecology"},{"id":"1-43","u":1,"word":"producer","ar":"منتج","meaning":"a living thing that makes its own food","icon":"🌱","example":"Grass is a producer because it makes food using sunlight.","group":"ecosystemrole"},{"id":"1-44","u":1,"word":"consumer","ar":"مستهلك","m const CLOSE={predator:['prey','consumer','top predator'],prey:['predator','primary consumer','consumer'],producer:['consumer','primary consumer','secondary consumer'],consumer:['producer','primary consumer','secondary consumer'], 'food chain':['food web','trophic level','ecosystem'],'food web':['food chain','ecosystem','trophic level'],herbivore:['carnivore','omnivore','predator'],carnivore:['herbivore','omnivore','predator'],omnivore:['herbivore','carnivore','consumer'],'primary consumer':['secondary consumer','producer','top predator'],'secondary consumer':['primary consumer','producer','top predator'],evaporation:['condensation','precipitation','water vapour'],condensation:['evaporation','precipitation','water vapour'],precipitation:['evaporation','condensation','rain'],filter:['pump','pipe','water tank'],pump:['filter','pipe','water tank'],pipe:['pump','filter','water tank'],sensor:['control system','power supply','frame'],sensors:['control system','power supply','frame'],'control system':['sensor','power supply','frame'],'power supply':['control system','sensor','frame'],kinetic_energy:['electricity','hydropower','generator'],translate:['communicate','visit','travel'],advantage:['drawback','reason','opinion'],drawback:['advantage','challenge','reason'],few:['many','much','little'],many:['few','much','little'],hexagon:['heptagon','octagon','triangle'],heptagon:['hexagon','octagon','triangle'],octagon:['hexagon','heptagon','triangle'],calligraphy:['mosaic','carving','Islamic art'],mosaic:['carving','calligraphy','tile'],carving:['mosaic','calligraphy','tile'],pattern:['sequence','mixed pattern','spiral'],sequence:['pattern','Fibonacci sequence','sum']};
const HARD=new Set(Object.keys(CLOSE));
function optionPool(w,level){let arr=WORDS.filter(x=>x.id!==w.id&&x.u===w.u);const named=(CLOSE[w.word]||[]).map(t=>WORDS.find(x=>x.word===t)).filter(Boolean);let group=arr.filter(x=>x.group===w.group);let pool=level==='challenging'?[...named,...group,...arr]:level==='moderate'?[...group,...named,...arr]:shuffle([...arr]);let uniq=[];for(let x of pool){if(x.id!==w.id&&!uniq.some(z=>z.id===x.id))uniq.push(x)};return (level==='easy'?shuffle(uniq):uniq).slice(0,2);}
function buildQuestion(w,level){let other=optionPool(w,level);const options=shuffle([w,...other]);const idx=w.example.toLowerCase().indexOf(w.word.toLowerCase());let s=w.example.slice(0,idx)+'______'+w.example.slice(idx+w.word.length);return {id:w.id,word:w,level,stem:s,options,answer:options.findIndex(x=>x.id===w.id),attempts:0,firstWrong:null,resolved:false,awarded:0};}
function chooseQuestions(n,u){let items=shuffle(WORDS.filter(w=>(u==='all'||String(w.u)===u)&&!['very','too','both','few','many','much','light','fat','food','clean','book','also'].includes(w.word)));
 const count=Math.min(n,items.length); let hardNum=Math.round(count*.2), mediumNum=Math.round(count*.4);if(count===5){hardNum=1;mediumNum=2}let hard=items.filter(w=>HARD.has(w.word)).slice(0,hardNum);let used=new Set(hard.map(x=>x.id));let rest=items.filter(x=>!used.has(x.id));let medium=rest.splice(0,mediumNum);let easy=rest.splice(0,count-hard.length-medium.length);return shuffle([...hard.map(x=>buildQuestion(x,'challenging')),...medium.map(x=>buildQuestion(x,'moderate')),...easy.map(x=>buildQuestion(x,'easy'))]);}
function practiceScreen(){ $('app').innerHTML=topHero()+`<div class="sectionbar"><div><h2>✏️ Exam-style vocabulary practice</h2><p>Every question is a sentence gap-fill with three closely related options, like Part 1 of the final assessment.</p></div></div><section class="card pad" style="margin-bottom:17px"><div class="form-row"><label class="field">Student name (optional)<input id="student" maxlength="80" placeholder="Name"></label><label class="field">Class (optional)<input id="class" maxlength="20" placeholder="7 / 1"></label><label class="field">Vocabulary from<select id="unit-choice">${unitOpts()}</select></label></div><p class="helptext" style="margin-bottom:0">All practice modes have a <strong>60-minute maximum</strong> countdown. Correct first answer = 2 marks; correct after a clue = 1 mark. Results are saved only in this browser.</p></section><div class="setup-grid"><section class="card mode-card"><div class="mode-art">⚡</div><h3>Quick 5</h3><p>5 questions × 2 marks = <strong>10 marks</strong>. Exactly the final exam vocabulary-part structure. Unlimited new rounds.</p><div class="badgelist"><span class="pill easy">2 easy</span><span class="pill moderate">2 moderate</span><span class="pill challenging">1 challenging</span></div><button class="cta primary" data-start="5">Start quick practice</button></section><section class="card mode-card"><div class="mode-art">📗</div><h3>Unit Challenge</h3><p>20 questions across your chosen unit(s), using a mix of close distractors and contextual examples. <strong>/40</strong>.</p><div class="badgelist"><span class="pill easy">40% easy</span><span class="pill moderate">40% moderate</span><span class="pill challenging">20% challenge</span></div><button class="cta primary" data-start="20">Start challenge</button></section><section class="card mode-card"><div class="mode-art">🏆</div><h3>One-Hour Mastery</h3><p>50 questions across all four units with mixed difficulty. Full-length revision and feedback. <strong>/100</strong>.</p><div class="badgelist"><span class="pill">50 questions</span><span class="pill">⏱️ 1 hour</span></div><button class="cta primary" data-start="50">Start 1-hour mock</button></section></div>`;document.querySelectorAll('[data-start]').forEach(b=>b.onclick=()=>{let n=+b.dataset.start,u=$('unit-choice').value;if(n===50)u='all';const qs=chooseQuestions(n,u);session={questions:qs,idx:0,score:0,start:Date.now(),end:Date.now()+3600000,name:$('student').value.trim(),className:$('class').value.trim(),done:false,u:u,wrong:[]};startTimer();quizScreen();});}
function startTimer(){clearInterval(tick);tick=setInterval(()=>{if(!session||session.done)return;const left=session.end-Date.now();if(left<=0){finish('Time is up!');return} const t=$('timer');if(t){t.textContent=clock(left);t.classList.toggle('low',left<600000)}},300)}
function clock(ms){let s=Math.max(0,Math.ceil(ms/1000)),m=Math.floor(s/60);return String(m).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function quizScreen(){const q=session.questions[session.idx];let finished=session.questions.filter(x=>x.resolved).length; $('app').innerHTML=`<div class="sectionbar"><div><h2>✏️ Vocabulary practice</h2><p>Read every sentence carefully; choose the most precise word.</p></div><button class="cta outline" id="finishEarly">Finish practice</button></div><div class="quiz-shell"><section class="card pad"><div class="sectionbar" style="margin:0"><span class="pill ${q.level}">${q.level.toUpperCase()}</span><strong>Question ${session.idx+1} of ${session.questions.length}</strong></div><div class="progress-track"><div class="progress-fill" style="width:${finished/session.questions.length*100}%"></div></div><p class="muted">Choose A, B or C to complete the sentence. (2 marks)</p><div class="question">${esc(q.stem)}</div><div class="options" id="answers">${q.options.map((o,i)=>`<button class="option" data-opt="${i}"><span class="letter">${'ABC'[i]}</span><span>${esc(o.word)}</span></button>`).join('')}</div><div id="message"></div><div id="nextbar" class="hide" style="margin-top:18px"><button class="cta primary" id="nextQ">${session.idx+1===session.questions.length?'View results':'Next question →'}</button></div></section><aside class="card side"><div class="eyebrow" style="color:#618b7e">Countdown</div><div id="timer" class="timer">${clock(session.end-Date.now())}</div><div class="progress-track"><div class="progress-fill" style="width:${(session.idx/session.questions.length)*100}%"></div></div><p>${session.idx} of ${session.questions.length} questions completed</p><p><strong>${session.score}</strong> / ${session.questions.length*2} marks earned</p><div class="notice" style="font-size:.82rem">🧠 A wrong answer is a chance to learn. After one mistake, you’ll see a clue and may try again.</div></aside></div>`;document.querySelectorAll('[data-opt]').forEach(b=>b.onclick=()=>answer(+b.dataset.opt));$('finishEarly').onclick=()=>{if(confirm('Finish this attempt and view your result?'))finish('Practice ended.');};}
function answer(index){const q=session.questions[session.idx];if(q.resolved||Date.now()>session.end)return;const buttons=[...document.querySelectorAll('[data-opt]')];q.attempts++;let correct=index===q.answer;
if(correct){q.resolved=true;q.awarded=q.attempts===1?2:1;session.score+=q.awarded;buttons.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('selected')});$('message').innerHTML=`<div class="feedback"><h3>✅ Well done! +${q.awarded} mark${q.awarded===1?'':'s'}</h3><p><strong>${esc(q.word.word)}</strong> — <span lang="ar" dir="rtl">${esc(q.word.ar)}</span></p><p>${esc(q.word.meaning)}</p><div class="evidence">${esc(q.word.example)}</div></div>`;$('nextbar').classList.remove('hide');$('nextQ').onclick=next;}
else {if(q.attempts===1){q.firstWrong=q.options[index].word;session.wrong.push(q.id);incorrect.add(q.id);STORE.setItem('g7_wrong_words',JSON.stringify([...incorrect]));buttons[index].disabled=true;buttons[index].classList.add('wrong');$('message').innerHTML=`<div class="feedback bad"><h3>💡 Not quite — use this clue and try once more</h3><p><strong>Meaning clue:</strong> ${esc(q.word.meaning)}</p><p class="arabic" lang="ar">${esc(q.word.ar)}</p><p><strong>Example from your revision:</strong> ${esc(q.word.example)}</p></div>`;}else{q.resolved=true;buttons.forEach((b,i)=>{b.disabled=true;if(i===q.answer)b.classList.add('selected');if(i===index)b.classList.add('wrong')});$('message').innerHTML=`<div class="feedback bad"><h3>📘 Learn this word</h3><p><strong>Best answer:</strong> ${esc(q.word.word)} — <span class="arabic" lang="ar">${esc(q.word.ar)}</span></p><p>${esc(q.word.meaning)}</p><div class="evidence">${esc(q.word.example)}</div></div>`;$('nextbar').classList.remove('hide');$('nextQ').onclick=next;}}
}
function next(){if(session.idx+1>=session.questions.length){finish('Great effort!');return;}session.idx++;quizScreen();}
function finish(msg){if(!session)return;clearInterval(tick);session.done=true;const completed=session.questions.filter(q=>q.resolved).length;let time=clock(Date.now()-session.start);let pct=Math.round(session.score/(session.questions.length*2)*100);let note={name:session.name||'Student',class:session.className||'',date:new Date().toISOString(),score:session.score,max:session.questions.length*2,completed,total:session.questions.length,missed:session.wrong.length,time};STORE.setItem('g7_last_vocab_result',JSON.stringify(note));$('app').innerHTML=`<div class="card results" style="max-width:790px;margin:36px auto"><div style="font-size:68px">${pct>=80?'🏆':pct>=60?'🌟':'🌱'}</div><h2>${esc(msg)}</h2><p class="muted">${esc(session.name||'Student')} ${session.className?'· Class '+esc(session.className):''}</p><div class="big">${session.score} / ${session.questions.length*2}</div><h3>${pct}% · ${completed}/${session.questions.length} answered</h3><p>Time spent: ${time} · Words for revision: ${new Set(session.wrong).size}</p><p class="helptext">Questions were drawn from the coursebook units and supporting revision vocabulary. This is practice, not an official result.</p><div class="filters" style="justify-content:center;margin-top:25px"><button class="cta primary" id="again">Practise again</button><button class="cta soft" id="review">Review my mistakes</button><button class="cta outline" id="download">Save score CSV</button></div></div>`;$('again').onclick=()=>{session=null;page='practice';render()};$('review').onclick=()=>{session=null;page='mistakes';filterUnit='all';search='';render()};$('download').onclick=()=>{const csv='Student,Class,Score,Maximum,Completed,Questions,Incorrect attempts,Date\n'+[note.name,note.class,note.score,note.max,note.completed,note.total,note.missed,note.date].map(x=>'"'+String(x).replaceAll('"','""')+'"').join(',')+'\n';let a=document.createElement('a'),blob=new Blob([csv],{type:'text/csv;charset=utf-8'});a.href=URL.createObjectURL(blob);a.download='Grade7_Vocabulary_Result.csv';a.click();setTimeout(()=>URL.revokeObjectURL(a.href),500);};nav();}
function render(){nav();if(page==='wall')wall();else if(page==='mistakes')wall(true);else practiceScreen();}
render();
